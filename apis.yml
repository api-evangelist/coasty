aid: coasty
name: Coasty
description: >-
  Coasty is a computer-use AI agent platform (Y Combinator S26) that operates a
  full desktop, browser, and terminal like a human — reading the screen with
  vision, clicking, typing, filling forms, running commands, and verifying its
  own work across sandboxed virtual machines. It exposes a public REST API at
  coasty.ai/v1 with a published OpenAPI 3.1 spec (72 operations), a first-party
  MCP server (npx @coasty/mcp, 26 tools), free sandbox keys, HMAC-SHA256 webhook
  triggers, an Idempotency-Key contract, per-credit metered billing, and 1,000+
  OAuth app integrations via Composio. Core API surfaces are Predict, Sessions,
  Ground, Parse, Machines, Schedules, Runs, and Workflows. Founded 2025-2026 by
  Prateek Jannu and Nitish Kovuru; #1 on the OSWorld benchmark among production
  computer-use agents.
