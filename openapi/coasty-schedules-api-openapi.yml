- name: Schedules
  description: Cron and one-shot scheduled CUA jobs.
paths:
  /v1/schedules:
    post:
      tags:
      - Schedules
      operationId: createSchedule
      summary: Create a schedule
      description: 'Cron-based or one-shot (run_at) scheduled task. Managed defaults: creation is free behind a $0.20 Developer API wallet gate; non-Unlimited execution uses the consumer subscription-credit balance at 10 credits/minute with a 20-credit start minimum. BYOK bypasses those Coasty wallet/start/runtime meters and debits zero platform credits. With a live Coasty key, the developer''s provider bills actual tokens. Under test auth, a managed-mode schedule remains deterministic sandbox execution. Any BYOK header or provider metadata instead returns 422 LLM_PROVIDER_UNSUPPORTED before execution: BYOK is unavailable for synthetic test runs, workflows, and schedules. Use managed mode or a live Coasty API key. Test execution never decrypts or requires a stored provider key and does not call or bill Anthropic/OpenAI. Live schedules require a stored key because fires have no request headers. A supplied header key is validation-only and must match the stored key; each live fire resolves the CURRENT stored key. Deleting it makes future live firings fail loudly with LLM_KEY_NOT_CONFIGURED, never platform fallback. Once a live firing produces a provider result, its terminal transition and content-free, zero-credit usage admission commit atomically; deferred projection remains service-only and retryable. The creating Coasty key id is internal usage attribution and is never added to the schedule response. Operator overrides remain discoverable under GET /v1/models pricing.schedules.'
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XLLMProvider'
      - $ref: '#/components/parameters/XLLMApiKey'
      - $ref: '#/components/parameters/XLLMModel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCreateRequest'
      responses:
        '200':
          description: Schedule created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
            X-Coasty-Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Idempotency-Status:
              $ref: '#/components/headers/IdempotencyStatus'
