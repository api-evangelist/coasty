components:
  schemas:
    LlmConfig:
      type: object
      additionalProperties: false
      description: 'Opt-in BYOK model selection. provider ''managed'' (or omitting llm) keeps the platform default. There is deliberately no api_key field (422 if attempted): keys ride the X-LLM-Api-Key header or the encrypted /v1/llm/keys store only. Once BYOK is requested there is NO silent fallback to Coasty''s platform LLM keys.'
      properties:
        provider:
          type: string
          enum:
          - managed
          - anthropic
          - openai
          default: managed
          description: Whose LLM account runs the harness. Anything else is 422 LLM_PROVIDER_UNSUPPORTED.
        model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: 'Main worker model. Defaults: claude-sonnet-5 (anthropic), gpt-5.6-sol (openai). Model ids are 1-256 characters, begin with a letter or number, and then use only letters, numbers, dot, underscore, colon, slash, plus, at-sign, or hyphen; invalid ids return 422 LLM_MODEL_INVALID. The selected provider can still reject an unknown or inaccessible model. It must be vision-capable.'
        grounding_model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: Override for pixel-coordinate grounding. Defaults to model. Grounding quality is tuned on the platform model; expect best results with the defaults.
        compaction_model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: Override for trajectory compaction. Defaults to model. A cheaper model here is the classic cost tune.
        code_agent_model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: Override for the code agent. Defaults to model.
    ScheduleResponse:
      type: object
      required:
      - id
      - name
      - machine_id
      - task_prompt
      - enabled
      - frequency
      - cron
      - timezone
      - request_id
      properties:
        id:
          type: string
        name:
          type: string
        machine_id:
          type: string
        task_prompt:
          type: string
        enabled:
          type: boolean
        frequency:
          type: string
        cron:
          type: string
        timezone:
          type: string
        next_run_at:
          type:
          - string
          - 'null'
          format: date-time
        last_run_at:
          type:
          - string
          - 'null'
          format: date-time
        run_count:
          type: integer
          default: 0
        consecutive_failures:
          type: integer
          default: 0
        paused_reason:
          type:
          - string
          - 'null'
        is_test:
          type: boolean
          default: false
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        metadata:
          type: object
          additionalProperties:
            type: string
        llm:
          description: Non-secret BYOK schedule preference returned by create/get/list/PATCH/pause/resume, but not by run-history records. Contains provider/model-role selections and the 12-lowercase-hex key fingerprint validated at creation. It never contains a key, ciphertext, or key_source. The preference is immutable through PATCH; each fire resolves the current stored key again, so rotation takes effect on the next fire without recreating the schedule.
          oneOf:
          - $ref: '#/components/schemas/ScheduleLlmPreference'
          - type: 'null'
        request_id:
          type: string
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
        api_version:
          type: string
        service:
          type: string
    CoordinateBounds:
      type: object
      required:
      - max_x
      - max_y
      additionalProperties: false
      description: Inclusive coordinate rectangle in the request screenshot's pixel space.
      properties:
        min_x:
          type: integer
          minimum: 0
          maximum: 3840
          default: 0
        min_y:
          type: integer
          minimum: 0
          maximum: 2160
          default: 0
        max_x:
          type: integer
          minimum: 0
          maximum: 3840
        max_y:
          type: integer
          minimum: 0
          maximum: 2160
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - type
          - retryable
          - retry_with_same_idempotency_key
          - request_id
          properties:
            code:
              type: string
              description: Stable machine-readable error code (e.g. INVALID_API_KEY, INSUFFICIENT_CREDITS).
              examples:
              - INVALID_API_KEY
            message:
              type: string
              description: Human-readable explanation. May include suggestions or examples.
            type:
              type: string
              enum:
              - auth_error
              - validation_error
              - rate_limit_error
              - billing_error
              - not_found_error
              - state_error
              - server_error
              - client_error
            request_id:
              type: string
              description: Server-assigned correlation ID. Include in support requests.
              examples:
              - req_a1b2c3d4e5f6
            suggestion:
              type: string
              description: A concrete next step, auto-filled per code. LLM agents can act on it to self-recover.
            retryable:
              type: boolean
              description: 'true when retrying the same call may succeed (transient server failures + back-pressure: INTERNAL_ERROR, DB_UNAVAILABLE, SERVICE_UNAVAILABLE, UPSTREAM_*, PREDICTION_FAILED, *_FAILED, RATE_LIMITED, TOO_MANY_RUNS, IDEMPOTENCY_IN_FLIGHT, ...). false for deterministic client errors. A CUA BILLING_UNAVAILABLE caused by refund uncertainty is false unless the server confirmed a shared recovery checkpoint. Present on EVERY error envelope, including gateway/5xx/timeout paths.'
            retry_with_same_idempotency_key:
              type: boolean
              description: 'true only when the concrete response permits replay and the original request already carried the key. This covers the exact 18 generic reserve-and-replay operations plus the separate account-scoped external-enrollment replay domain. Reuse that SAME key with its identical bound inputs. A retryable error alone does not make an operation idempotent, and a key cannot be added retroactively. For CUA refund uncertainty this is true only after an exact shared checkpoint was confirmed; unkeyed or uncheckpointed responses are false and must not be retried automatically. A confirmed refunded failure sets this false even when retryable remains true: use a new key, because the old debit is compensated and wallet-guarded by IDEMPOTENCY_ALREADY_REFUNDED. false for deterministic errors.'
            retry_after:
              type:
              - integer
              - 'null'
              description: Seconds to wait before retrying (accompanies retryable:true back-pressure codes; mirrors the Retry-After header).
            rule:
              type: string
              enum:
              - max_actions
              - structured_action
              - allowed_actions
              - blocked_actions
              - blocked_keys
              - block_window_close
              - coordinate_bounds
              description: Present on ACTION_POLICY_VIOLATION errors and identifies the enforced policy rule.
            action_index:
              type: integer
              minimum: 0
              description: Zero-based proposed-action index on ACTION_POLICY_VIOLATION when the rule is attributable to one action; omitted for batch-level rules such as max_actions.
            action_type:
              type: string
              description: Proposed action type on ACTION_POLICY_VIOLATION when attributable to one action; omitted for batch-level or uninspectable values.
            examples:
              type: object
              additionalProperties: true
              description: 'Machine-readable limits for self-correction. On PAYLOAD_TOO_LARGE / INVALID_SCREENSHOT: { max_base64_bytes: 10485760 (legacy name), max_base64_chars: 10485760, max_request_body_bytes: 15728640, max_mb: 10, min_base64_chars: 100, formats: ["png","jpeg"] }.'
    ListScheduleRunsResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleRunRecord'
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
          default: false
        request_id:
          type: string
    ScheduleUpdateRequest:
      type: object
      additionalProperties: false
      description: 'Partial schedule update. Supplying cron alone promotes the schedule to frequency=custom; cron with an explicit non-custom frequency is rejected. llm, machine_id, and run_at are intentionally immutable through PATCH; delete and recreate the schedule to change them.


        Timing fields are MERGED over stored state, not reset. A PATCH that does not restate `time`, `day_of_week` or `day_of_month` inherits the stored value, so changing only the timezone on a "daily at 14:30" job leaves it at 14:30 rather than falling back to the preset default of 09:00. Each selector is inherited only where the target frequency accepts it: `time` for daily/weekly/monthly, `day_of_week` for weekly, `day_of_month` for monthly. Switching frequency therefore drops a selector the new frequency cannot express instead of turning a harmless PATCH into a 422.


        The same acceptance rules as create apply to values you DO send: see each field.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        task_prompt:
          type: string
          minLength: 1
          maxLength: 8000
        frequency:
          type:
          - string
          - 'null'
          enum:
          - every_15_minutes
          - every_30_minutes
          - hourly
          - every_6_hours
          - every_12_hours
          - daily
          - weekly
          - monthly
          - custom
          - null
        cron:
          oneOf:
          - $ref: '#/components/schemas/ScheduleCronExpression'
          - type: 'null'
          description: A cron supplied without frequency implies frequency=custom.
        timezone:
          type:
          - string
          - 'null'
          maxLength: 64
          description: IANA timezone name. Non-null values are validated against the runtime IANA timezone database.
        time:
          type:
          - string
          - 'null'
          maxLength: 5
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: HH:MM in 24-hour format. Accepted only when the effective frequency is daily, weekly or monthly; sending it against a sub-daily preset (every_15_minutes, every_30_minutes, hourly, every_6_hours, every_12_hours) or against frequency='custom' returns 422 VALIDATION_ERROR. Omit it to keep the stored time-of-day.
        day_of_week:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 6
          description: 0=Monday .. 6=Sunday. Accepted only when the effective frequency is 'weekly'; otherwise 422 VALIDATION_ERROR. Omit it to keep the stored day.
        day_of_month:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 28
          description: Accepted only when the effective frequency is 'monthly'; otherwise 422 VALIDATION_ERROR. Omit it to keep the stored day.
        max_consecutive_failures:
          type: integer
          minimum: 1
          maximum: 50
        enabled:
          type: boolean
        metadata:
          oneOf:
          - $ref: '#/components/schemas/ScheduleMetadata'
          - type: 'null'
      not:
        required:
        - frequency
        - cron
        properties:
          frequency:
            enum:
            - every_15_minutes
            - every_30_minutes
            - hourly
            - every_6_hours
            - every_12_hours
            - daily
            - weekly
            - monthly
          cron:
            $ref: '#/components/schemas/ScheduleCronExpression'
    ScheduleCreateRequest:
      type: object
      required:
      - name
      - machine_id
      - task_prompt
      additionalProperties: false
      description: 'Create exactly one timing mode: a non-custom frequency preset, custom plus a cron expression, or a one-shot run_at date-time.


        The timing refinements (`time`, `day_of_week`, `day_of_month`) are only accepted where the chosen frequency can actually express them. A refinement the frequency cannot carry is a 422 VALIDATION_ERROR, never a silent no-op or a silent reinterpretation. See each field.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        machine_id:
          type: string
          minLength: 1
          maxLength: 64
        task_prompt:
          type: string
          minLength: 1
          maxLength: 8000
        frequency:
          type:
          - string
          - 'null'
          enum:
          - every_15_minutes
          - every_30_minutes
          - hourly
          - every_6_hours
          - every_12_hours
          - daily
          - weekly
          - monthly
          - custom
          - null
        cron:
          oneOf:
          - $ref: '#/components/schemas/ScheduleCronExpression'
          - type: 'null'
          description: Required when frequency is custom; otherwise omit it or use null.
        timezone:
          type: string
          maxLength: 64
          default: UTC
          description: IANA timezone name used for cron evaluation, for example America/Los_Angeles. The server validates it against the runtime IANA timezone database.
        time:
          type:
          - string
          - 'null'
          maxLength: 5
          pattern: ^([01]\d|2[0-3]):[0-5]\d$
          description: 'HH:MM 24-hour, evaluated in `timezone`. Valid ONLY for the daily-or-slower presets: daily, weekly, monthly.


            Sending it with a sub-daily frequency (every_15_minutes, every_30_minutes, hourly, every_6_hours, every_12_hours) returns 422 VALIDATION_ERROR, because applying a time-of-day overwrites the recurrence''s minute and hour fields and collapses it into a single daily run. For example {"frequency":"hourly","time":"09:30"} would turn "0 * * * *" into "30 09 * * *". Use a daily-or-slower preset, or frequency=''custom'' with an explicit cron.


            Also 422 when combined with frequency=''custom'': the cron IS the schedule, so encode the timing in the cron expression itself.'
        day_of_week:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 6
          description: 0=Monday .. 6=Sunday. Valid ONLY with frequency='weekly'; any other frequency (including 'custom') returns 422 VALIDATION_ERROR. It was previously accepted and silently ignored.
        day_of_month:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 28
          description: Valid ONLY with frequency='monthly'; any other frequency (including 'custom') returns 422 VALIDATION_ERROR. It was previously accepted and silently ignored. Capped at 28 so a schedule fires in every month.
        run_at:
          oneOf:
          - type: string
            format: date-time
            maxLength: 64
          - type: 'null'
          description: ISO 8601 date-time for a one-shot schedule. At runtime it must be in the future or no more than 60 seconds in the past; a missing timezone offset is interpreted as UTC.
        max_consecutive_failures:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
        metadata:
          oneOf:
          - $ref: '#/components/schemas/ScheduleMetadata'
          - type: 'null'
        llm:
          $ref: '#/components/schemas/LlmConfig'
        action_policy:
          $ref: '#/components/schemas/ActionPolicy'
          description: Immutable policy inherited by every schedule firing, retry, recovery, and nested CUA delegation.
      oneOf:
      - title: Recurring preset
        required:
        - frequency
        properties:
          frequency:
            enum:
            - every_15_minutes
            - every_30_minutes
            - hourly
            - every_6_hours
            - every_12_hours
            - daily
            - weekly
            - monthly
          cron:
            type: 'null'
          run_at:
            type: 'null'
      - title: Recurring custom cron
        required:
        - frequency
        - cron
        properties:
          frequency:
            const: custom
          cron:
            $ref: '#/components/schemas/ScheduleCronExpression'
          run_at:
            type: 'null'
      - title: One-shot date-time
        required:
        - run_at
        properties:
          frequency:
            type: 'null'
          cron:
            type: 'null'
          run_at:
            type: string
            format: date-time
            maxLength: 64
    ScheduleRunRecord:
      type: object
      description: Durable execution history. It deliberately omits the schedule llm preference, provider credentials, prompts, screenshots, and provider-token totals; read the ScheduleResponse for its non-secret configured preference.
      required:
      - id
      - schedule_id
      - status
      - trigger
      - executed_at
      properties:
        id:
          type: string
        schedule_id:
          type: string
        status:
          type: string
          enum:
          - queued
          - running
          - completed
          - failed
          - skipped
          - cancelled
          - insufficient_credits
        trigger:
          type: string
          enum:
          - cron
          - manual
          - triggered
          - webhook
          - email
          - run_at
        duration_seconds:
          type:
          - integer
          - 'null'
        credits_charged:
          type:
          - integer
          - 'null'
          minimum: 0
          description: Consumer subscription-credit quota units charged for scheduled execution, not Developer API wallet cents. Zero for test, Unlimited-bypass, and other non-billable runs; no fixed USD conversion.
        error:
          type:
          - string
          - 'null'
        executed_at:
          type: string
          format: date-time
    ListSchedulesResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ScheduleResponse'
        has_more:
          type: boolean
          default: false
        request_id:
          type: string
    ScheduleMetadata:
      type: object
      maxProperties: 16
      propertyNames:
        maxLength: 64
      additionalProperties:
        type: string
        maxLength: 256
      description: 'Free-form string tags: at most 16 entries, with keys up to 64 characters and values up to 256 characters.'
    ScheduleLlmPreference:
      type: object
      additionalProperties: false
      required:
      - provider
      - model
      - key_fingerprint
      properties:
        provider:
          type: string
          enum:
          - anthropic
          - openai
        model:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
        grounding_model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
        compaction_model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
        code_agent_model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
        key_fingerprint:
          type: string
          minLength: 12
          maxLength: 12
          pattern: ^[0-9a-f]{12}$
      description: Credential-free schedule preference. The schedule never stores a provider key or ciphertext; the current stored key is resolved at every fire.
    DeleteScheduleResponse:
      type: object
      required:
      - deleted
      - schedule_id
      - request_id
      properties:
        deleted:
          type: boolean
        schedule_id:
          type: string
        request_id:
          type: string
    RunScheduleResponse:
      type: object
      required:
      - schedule_id
      - run_id
      - status
      - message
      - request_id
      properties:
        schedule_id:
          type: string
        run_id:
          type: string
        status:
          type: string
          enum:
          - running
          - queued
          - skipped
          - completed
        message:
          type: string
        request_id:
          type: string
    ScheduleCronExpression:
      type: string
      maxLength: 128
      pattern: ^\S+(?:\s+\S+){4,5}$
      description: A 5- or 6-field cron expression. The server performs full cron parser validation before saving or firing the schedule.
    ActionPolicy:
      type: object
      additionalProperties: false
      description: Opt-in, fail-closed post-model action enforcement. The complete normalized batch is checked atomically before actions are returned or dispatched. allowed_actions and blocked_actions cannot overlap. Prediction, Session, and Parse surfaces use prediction action names such as type_text; direct Machine routes use command names such as type. Task, Workflow, and Schedule policies are create-time controls inherited across execution and recovery.
      properties:
        allowed_actions:
          type:
          - array
          - 'null'
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^\s*[A-Za-z][A-Za-z0-9_:-]{0,63}\s*$
          description: Optional action allowlist. Values are trimmed and lowercased before validation; duplicates after normalization are rejected. Terminal done/fail/awaiting_human signals remain allowed.
        blocked_actions:
          type: array
          maxItems: 128
          uniqueItems: true
          default: []
          items:
            type: string
            pattern: ^\s*[A-Za-z][A-Za-z0-9_:-]{0,63}\s*$
          description: Action denylist. Values are trimmed and lowercased before validation; duplicates after normalization are rejected.
        blocked_keys:
          type: array
          maxItems: 128
          uniqueItems: true
          default: []
          items:
            type: string
            pattern: ^\s*[A-Za-z0-9_+\-=\[\]\\;',./`]{1,64}\s*$
          description: Keys forbidden in key_press, key_combo, and modifier-bearing actions. Values are trimmed and lowercased; duplicates after normalization are rejected; esc aliases escape.
        block_window_close:
          type: boolean
          default: false
          description: Block explicit close commands and common Alt+F4, Ctrl/Cmd+W, and Cmd+Q shortcuts.
        max_actions:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
          description: Maximum number of actions admitted in one prediction/session step, parsed action batch, or direct Machine batch.
        coordinate_bounds:
          anyOf:
          - $ref: '#/components/schemas/CoordinateBounds'
          - type: 'null'
    RunScheduleRequest:
      type: object
      additionalProperties: false
      properties:
        task_prompt_override:
          type:
          - string
          - 'null'
          maxLength: 8000
        triggered_context:
          type:
          - object
          - 'null'
          additionalProperties: true
