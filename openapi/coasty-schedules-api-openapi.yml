components:
  headers:
    CoastyRequestId:
      description: Coasty correlation identifier for this request.
      schema:
        type: string
    TestMode:
      description: true when the request executed against the sandbox namespace.
      schema:
        type: boolean
    RetryAfter:
      description: Seconds to wait before retrying. Present on retryable back-pressure and transient failures.
      schema:
        type: integer
        minimum: 0
    IdempotencyStatus:
      description: Lifecycle status of the canonical idempotent attempt when applicable.
      schema:
        type: string
        enum:
        - processing
        - completed
    KeyKind:
      description: Whether the authenticated key is live or test.
      schema:
        type: string
        enum:
        - live
        - test
        - legacy
    CreditsCharged:
      description: Credits charged by this response (zero for sandbox keys and stored replays).
      schema:
        type: integer
        minimum: 0
    CreditsRefunded:
      description: Credits durably returned to the wallet after a failed billed operation.
      schema:
        type: integer
        minimum: 1
    IdempotentReplay:
      description: true when this is a stored response replay rather than a new execution.
      schema:
        type: boolean
  schemas:
    ScheduleUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        task_prompt:
          type: string
          minLength: 1
          maxLength: 8000
        frequency:
          type: string
        cron:
          type: string
          maxLength: 128
        timezone:
          type: string
          maxLength: 64
        time:
          type: string
          maxLength: 5
        day_of_week:
          type: integer
          minimum: 0
          maximum: 6
        day_of_month:
          type: integer
          minimum: 1
          maximum: 28
        max_consecutive_failures:
          type: integer
          minimum: 1
          maximum: 50
        enabled:
          type: boolean
        metadata:
          type: object
          additionalProperties:
            type: string
    RunScheduleRequest:
      type: object
      additionalProperties: false
      properties:
        task_prompt_override:
          type:
          - string
          - 'null'
          maxLength: 8000
        triggered_context:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Free-form context injected into the agent's prompt. Max 1 MB serialized.
    ScheduleCreateRequest:
      type: object
      required:
      - name
      - machine_id
      - task_prompt
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        machine_id:
          type: string
          minLength: 1
          maxLength: 64
        task_prompt:
          type: string
          minLength: 1
          maxLength: 8000
        frequency:
          type:
          - string
          - 'null'
          enum:
          - every_15_minutes
          - every_30_minutes
          - hourly
          - every_6_hours
          - every_12_hours
          - daily
          - weekly
          - monthly
          - custom
        cron:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Required when frequency='custom'. 5- or 6-field cron expression.
        timezone:
          type: string
          maxLength: 64
