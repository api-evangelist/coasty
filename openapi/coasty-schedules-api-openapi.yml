        day_of_week:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 6
        day_of_month:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 28
        run_at:
          type:
          - string
          - 'null'
          format: date-time
          description: ISO 8601 UTC timestamp for a one-shot schedule. Mutually exclusive with frequency.
        max_consecutive_failures:
          type: integer
          minimum: 1
          maximum: 50
          default: 5
        metadata:
          type: object
          additionalProperties:
            type: string
        llm:
          $ref: '#/components/schemas/LlmConfig'
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
        api_version:
          type: string
        service:
          type: string
    ListSchedulesResponse:
      type: object
