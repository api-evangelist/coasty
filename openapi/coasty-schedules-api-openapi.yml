        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
          default: false
        request_id:
          type: string
    ScheduleResponse:
      type: object
      required:
      - id
      - name
      - machine_id
      - task_prompt
      - enabled
      - frequency
      - cron
      - timezone
      - request_id
      properties:
