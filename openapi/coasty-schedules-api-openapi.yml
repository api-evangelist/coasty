        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: schedules:write
      x-required-scopes:
      - schedules:write
      x-scope-policy: required
      x-billing-code: null
      x-offering: schedules
      x-feature-flag: PUBLIC_SCHEDULES_API_ENABLED
      x-idempotency: reserve-and-replay
    get:
      tags:
      - Schedules
      operationId: listSchedules
      summary: List schedules
      description: 'Scope: `schedules:read`. A schedule-store outage returns 503 DB_UNAVAILABLE with Retry-After, not a bare 500.'
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
