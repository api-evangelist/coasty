          type: integer
          default: 0
          description: USD-cent amount; the same numeric value as credits_charged (divide by 100 for USD).
        breakdown:
          type:
          - array
          - 'null'
          description: Self-auditable per-call cost breakdown; line credits sum to credits_charged. null on free/test/no-charge calls and /v1/parse.
          items:
            type: object
            required:
            - item
            - credits
            properties:
              item:
                type: string
                enum:
                - base
                - trajectory
                - hd_images
                - engine
                - custom_prompt
              credits:
                type: integer
              count:
                type:
                - integer
                - 'null'
                description: Optional multiplier (e.g. number of HD screenshots billed); omitted where it adds nothing.
        billed:
          type: boolean
          description: 'true on a real Coasty wallet debit; false on BYOK, test keys (sk-coasty-test-*), and idempotent replays (all return credits_charged: 0).'
        llm_provider:
          type: string
          enum:
          - managed
          - anthropic
          - openai
          default: managed
          description: Effective inference provider. Non-managed values identify provider-direct BYOK execution.
        llm_model:
          type:
          - string
          - 'null'
          description: Effective BYOK model id; null for managed inference.
        llm_key_fingerprint:
          type:
          - string
          - 'null'
          minLength: 12
          maxLength: 12
          pattern: ^[0-9a-f]{12}$
          description: Non-secret SHA-256 prefix identifying the BYOK key; never the key itself.
        llm_key_source:
          type:
          - string
          - 'null'
          enum:
          - header
          - stored
          description: Where the effective BYOK key came from; null for managed inference.
        platform_cost_exempt:
          type: boolean
          default: false
          description: true for BYOK. Coasty credits/cost are zero. Provider billing occurs only for provider-direct execution. Managed-mode test Task, Workflow, and schedule sandbox execution makes no provider call; test-auth BYOK intent on those async endpoints is rejected before execution.
    ScreenshotBase64:
      description: One static PNG/JPEG screenshot as raw base64 or an exact data:image/png;base64 / data:image/jpeg;base64 URI. Animated and multi-frame images are rejected. This per-image limit does not multiply the ordinary 15 MiB aggregate JSON request-body cap.
      oneOf:
      - type: string
        minLength: 100
        maxLength: 10485760
        pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
        title: Raw base64
      - type: string
        minLength: 122
        maxLength: 10485782
        pattern: ^data:image/png;base64,(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
        title: PNG data URI
      - type: string
        minLength: 123
        maxLength: 10485783
        pattern: ^data:image/jpeg;base64,(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
        title: JPEG data URI
    PredictionTypeTextParameters:
      type: object
      required:
      - text
