    PredictionKeyComboParameters:
      type: object
      required:
      - keys
      additionalProperties: false
      description: 'One focus-sensitive keyboard chord: modifiers are held together while the final key is pressed. Clipboard paste is one [ctrl,v] chord on Windows/Linux or [cmd,v] on macOS; the client must preload the clipboard and focus the destination first.'
      properties:
        keys:
          type: array
          minItems: 2
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Keys held as one chord, for example ["ctrl", "v"], not two sequential taps.
    SessionPredictResponse:
      type: object
      required:
      - request_id
      - session_id
      - step
      - actions
      - status
      - usage
      properties:
        request_id:
          type: string
        session_id:
          type: string
        step:
          type: integer
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ActionResponse'
        raw_code:
          type: array
          items:
            type: string
        reasoning:
          type: string
        status:
          type: string
          enum:
          - continue
          - done
          - fail
          description: Authoritative model loop-control claim for this session step. done may describe the observed state or the proposed step outcome and may coexist with mutating actions; it is not proof of persistence and does not close the session. Execute only admitted actions, capture a fresh post-action screenshot, verify application state, then DELETE or reset the session at the intended flow boundary.
        cua_version:
          type:
          - string
          - 'null'
          description: 'Echo: the CUA engine version that actually served this step (e.g. "v5").'
        usage:
          $ref: '#/components/schemas/UsageInfo'
    PredictionDragParameters:
      type: object
      required:
      - x1
      - y1
      - x2
      - y2
      additionalProperties: false
      properties:
        x1:
          type: integer
          minimum: 0
          maximum: 100000
        y1:
          type: integer
          minimum: 0
          maximum: 100000
        x2:
          type: integer
          minimum: 0
          maximum: 100000
        y2:
          type: integer
          minimum: 0
          maximum: 100000
        button:
          type: string
          enum:
          - left
          - right
          - middle
          default: left
        hold_keys:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 64
    ActionPolicy:
      type: object
      additionalProperties: false
      description: Opt-in, fail-closed post-model action enforcement. The complete normalized batch is checked atomically before actions are returned or dispatched. allowed_actions and blocked_actions cannot overlap. Prediction, Session, and Parse surfaces use prediction action names such as type_text; direct Machine routes use command names such as type. Task, Workflow, and Schedule policies are create-time controls inherited across execution and recovery.
      properties:
        allowed_actions:
          type:
          - array
          - 'null'
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^\s*[A-Za-z][A-Za-z0-9_:-]{0,63}\s*$
          description: Optional action allowlist. Values are trimmed and lowercased before validation; duplicates after normalization are rejected. Terminal done/fail/awaiting_human signals remain allowed.
        blocked_actions:
          type: array
          maxItems: 128
          uniqueItems: true
          default: []
          items:
            type: string
            pattern: ^\s*[A-Za-z][A-Za-z0-9_:-]{0,63}\s*$
          description: Action denylist. Values are trimmed and lowercased before validation; duplicates after normalization are rejected.
        blocked_keys:
          type: array
          maxItems: 128
          uniqueItems: true
          default: []
          items:
            type: string
            pattern: ^\s*[A-Za-z0-9_+\-=\[\]\\;',./`]{1,64}\s*$
          description: Keys forbidden in key_press, key_combo, and modifier-bearing actions. Values are trimmed and lowercased; duplicates after normalization are rejected; esc aliases escape.
        block_window_close:
          type: boolean
          default: false
          description: Block explicit close commands and common Alt+F4, Ctrl/Cmd+W, and Cmd+Q shortcuts.
        max_actions:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
          description: Maximum number of actions admitted in one prediction/session step, parsed action batch, or direct Machine batch.
        coordinate_bounds:
          anyOf:
          - $ref: '#/components/schemas/CoordinateBounds'
          - type: 'null'
    PredictionFailParameters:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 32000
        code:
          type: string
          const: ACTION_POLICY_VIOLATION
          description: Present when fail is the structured result of post-model action-policy enforcement.
        rule:
          type: string
          enum:
          - max_actions
          - structured_action
          - allowed_actions
          - blocked_actions
          - blocked_keys
          - block_window_close
          - coordinate_bounds
        message:
          type: string
          maxLength: 32000
        action_index:
          type: integer
          minimum: 0
          description: Zero-based index when the violation is attributable to one proposed action; omitted for batch-level rules such as max_actions.
        action_type:
          type: string
          description: Action type when the violation is attributable to one proposed action; omitted for batch-level or uninspectable values.
    PredictionWaitParameters:
      type: object
      required:
      - seconds
      additionalProperties: false
      properties:
        seconds:
          type: number
          minimum: 0
          maximum: 30
