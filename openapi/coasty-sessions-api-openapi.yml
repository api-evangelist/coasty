            type: string
            description: Canonical safe pyautogui generated from the validated structured action. Never unsanitized model text.
      - type: object
        required:
        - action_type
        - params
        additionalProperties: false
        properties:
          action_type:
            type: string
            const: wait
          params:
            $ref: '#/components/schemas/PredictionWaitParameters'
          description:
            type: string
          raw_code:
            type: string
            description: Canonical safe pyautogui generated from the validated structured action. Never unsanitized model text.
      - type: object
        required:
        - action_type
        - params
        additionalProperties: false
        properties:
          action_type:
            type: string
