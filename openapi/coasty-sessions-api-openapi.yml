        screen_height:
          type: integer
          minimum: 240
          maximum: 2160
          default: 1080
        max_trajectory_length:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
          description: Server-side retained-history ceiling. At prediction time provider image 20 is reserved for the current screenshot, so at most the newest 19 prior screenshots are sent. The trajectory surcharge uses the exact prior screenshots actually included after compaction, not this configured ceiling.
        system_prompt:
          type:
          - string
