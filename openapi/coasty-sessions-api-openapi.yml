          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Ordered taps. For example, ["tab", "enter"] means Tab, release, then Enter, release.
    CreateSessionRequest:
      type: object
