openapi: 3.2.0
info:
  title: Coasty Public Triggers API
  version: 1.0.0
  summary: Computer Use Agents, scheduled automation, and managed VMs.
  description: '# Coasty Public API


    Coasty is a Computer Use Agent (CUA) platform: predict actions from screenshots,

    provision managed VMs, and run scheduled automation against them. ## Authentication


    All endpoints (except `/v1/triggers/webhook/{webhook_id}` and health checks) require an API key. Pass it as either:


    - `X-API-Key: sk-coasty-live-...` (or `sk-coasty-test-...` for sandbox)

    - `Authorization: Bearer sk-coasty-live-...`


    The external webhook endpoint does not use an API key, but it is authenticated:

    send the HMAC-SHA256 `Coasty-Signature` credential documented on that operation. Test-mode keys (`sk-coasty-test-*`) preserve the same core schemas for documented

    sandbox-supported operations and never debit Coasty credits. With a test Coasty key,

    explicit BYOK is provider-direct only for the direct CUA flow: `POST /v1/predict`,

    `POST /v1/ground`, `POST /v1/sessions`, and `POST /v1/sessions/{id}/predict`. Predict, ground, and session create require an explicit per-request X-LLM-Api-Key plus

    X-LLM-Provider under test auth. A body provider without that header returns 422

    LLM_KEY_NOT_CONFIGURED: Stored provider keys are unavailable for test API keys. Send

    X-LLM-Api-Key explicitly for direct BYOK. Test auth never reads or uses a stored live provider

    key. Session create fixes that explicit key for

    inherited predicts but makes no inference call. Predict, ground, and session predict can bill

    the supplied provider account. Managed-mode Task runs, Workflow runs, and schedules remain

    deterministic sandbox. BYOK intent on those async endpoints returns 422

    LLM_PROVIDER_UNSUPPORTED before execution: BYOK is unavailable for synthetic test runs,

    workflows, and schedules. Use managed mode or a live Coasty API key. They never decrypt or

    require a stored provider key and do not call or bill Anthropic/OpenAI. Live-only stored BYOK-key access or mutation is unavailable to test keys. Keep real provider

    secrets out of sandbox and CI requests, and use a live Coasty key for real async execution. ## Pricing & budgeting


    Published base rates and defaults (read effective deployed CUA/task pricing at

    `GET /v1/models` → `pricing`, and machine runtime pricing at `GET /v1/machines/pricing`):


    | Endpoint | Credits |

    |---|---|

    | `POST /v1/predict` | Managed: 5 base; BYOK: 0 |

    | `POST /v1/sessions` | Managed: 10 fixed; BYOK: 0 |

    | `POST /v1/sessions/{id}/predict` | Managed: 4 base; BYOK: 0 |

    | `POST /v1/ground` | Managed: 3 base; BYOK: 0 |

    | `POST /v1/parse` | 0 (free) |


    Predict and session-predict can add provider-visible trajectory-image, HD current/trajectory

    image, v1-engine, and combined system_prompt + trimmed-instructions (>500 chars) surcharges. Ground can add only the current-image HD surcharge; session creation has no surcharge. Managed-model published defaults: scheduled CUA execution bills the consumer subscription-credit balance

    at 10 credits/minute with a 20-credit start minimum for non-Unlimited accounts. Unlimited

    bypasses that runtime credit meter/start gate but retains token and concurrency safeguards. Managed schedule create/run-now use a $0.20 API-wallet eligibility gate. BYOK schedules

    bypass that gate and the runtime credit meter and debit zero Coasty platform credits. Live-key schedule execution is provider-billed. Managed-mode test execution is deterministic sandbox; test-auth BYOK intent returns 422 LLM_PROVIDER_UNSUPPORTED. Read `GET /v1/models` →

    `pricing.schedules` for effective values, plan applicability, and webhook policy. Your subscription tier (`free | starter | professional | enterprise`) is

    reported on the key, but the developer API is PREPAID: what bounds you is your

    credit balance, not your plan. Custom prompts in particular are NOT tier-gated. `system_prompt` and `instructions` are available on every tier including free,

    against a budget of 32,000 characters SHARED between the two fields (the sum is

    measured, and exceeding it returns 400 INPUT_TOO_LARGE).'
  contact:
    name: Coasty Developer Support
    url: https://coasty.ai/support
    email: founders@coasty.ai
  license:
    name: MIT
    identifier: MIT
  termsOfService: https://coasty.ai/terms
servers:
- url: https://coasty.ai
  description: Production
- url: https://coasty.ai
  description: Sandbox — use sk-coasty-test-* keys against the same host. No Coasty billing. Explicit-header BYOK can call the provider only for predict, ground, and inherited session predict; session create fixes the header key without inference, and test auth never reads a stored live key. Managed-mode Tasks, Workflows, and schedules remain deterministic sandbox. BYOK intent on those async endpoints returns 422 LLM_PROVIDER_UNSUPPORTED before execution and makes no provider call.
security:
- apiKey: []
- bearerAuth: []
tags:
- name: Triggers
  description: Webhook and chain triggers for schedules.
paths:
  /v1/schedules/{schedule_id}/triggers:
    parameters:
    - $ref: '#/components/parameters/ScheduleId'
    get:
      tags:
      - Triggers
      operationId: listTriggers
      summary: List triggers attached to a schedule
      security:
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: Triggers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTriggersResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: schedules:read
      x-required-scopes:
      - schedules:read
      x-scope-policy: required
      x-billing-code: null
      x-offering: schedules
      x-feature-flag: PUBLIC_SCHEDULES_API_ENABLED
      x-idempotency: none
    post:
      tags:
      - Triggers
      operationId: addTrigger
      summary: Add a trigger (webhook | chain)
      description: For `webhook`, create and exact bounded Idempotency-Key replay responses include the same HMAC `webhook_secret`; GET/list never expose it. It is encrypted at rest for verification/replay recovery, so store your copy securely. Chain triggers support a max depth of 5.
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TriggerCreateRequest'
      responses:
        '200':
          description: Trigger created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TriggerResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
            X-Coasty-Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Idempotency-Status:
              $ref: '#/components/headers/IdempotencyStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: triggers:write
      x-required-scopes:
      - triggers:write
      x-scope-policy: required
      x-billing-code: null
      x-offering: schedules
      x-feature-flag: PUBLIC_SCHEDULES_API_ENABLED
      x-idempotency: reserve-and-replay
  /v1/schedules/{schedule_id}/triggers/{trigger_id}:
    parameters:
    - $ref: '#/components/parameters/ScheduleId'
    - $ref: '#/components/parameters/TriggerId'
    delete:
      tags:
      - Triggers
      operationId: removeTrigger
      summary: Remove a trigger
      security:
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteTriggerResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: triggers:write
      x-required-scopes:
      - triggers:write
      x-scope-policy: required
      x-billing-code: null
      x-offering: schedules
      x-feature-flag: PUBLIC_SCHEDULES_API_ENABLED
      x-idempotency: none
  /v1/triggers/webhook/{webhook_id}:
    parameters:
    - $ref: '#/components/parameters/WebhookId'
    post:
      tags:
      - Triggers
      operationId: fireWebhook
      summary: Fire a schedule from an HMAC-authenticated external webhook
      description: 'No Coasty API key is used. The request is authenticated with HMAC-SHA256 over `.` using the secret from trigger creation. Send either `Coasty-Signature: t=,v1=` or its `X-Coasty-Signature` compatibility alias. Published defaults are a 300-second replay window, 1,000,000-byte body cap, and 60-second identical-(webhook_id, body) deduplication window. Read effective deployed values from GET /v1/models under pricing.schedules.'
      security:
      - webhookHmac: []
      - webhookHmacLegacy: []
      parameters:
      - name: Coasty-Signature
        in: header
        required: false
        description: Primary HMAC credential. Exactly one supported signature header is required.
        schema:
          type: string
          examples:
          - t=1714900000,v1=4d2f...e7
      - name: X-Coasty-Signature
        in: header
        required: false
        description: Compatibility alias for Coasty-Signature. Send one signature header, not both.
        schema:
          type: string
          examples:
          - t=1714900000,v1=4d2f...e7
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          text/plain:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Webhook accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookFireResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/WebhookUnauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          description: Body exceeds 1 MB.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Credits-Charged:
              $ref: '#/components/headers/CreditsCharged'
            X-Credits-Refunded:
              $ref: '#/components/headers/CreditsRefunded'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: PAYLOAD_TOO_LARGE
                  message: An error occurred. See `code` for details.
                  type: validation_error
                  request_id: req_a1b2c3d4e5f6
                  retryable: false
                  retry_with_same_idempotency_key: false
        '429':
          description: Webhook per-minute rate limit exceeded. Honor Retry-After.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Credits-Charged:
              $ref: '#/components/headers/CreditsCharged'
            X-Credits-Refunded:
              $ref: '#/components/headers/CreditsRefunded'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: RATE_LIMITED
                  message: An error occurred. See `code` for details.
                  type: validation_error
                  request_id: req_a1b2c3d4e5f6
                  retryable: false
                  retry_with_same_idempotency_key: false
        '500':
          $ref: '#/components/responses/ServerError'
      x-auth-mode: hmac_sha256
      x-required-scope: null
      x-required-scopes: []
      x-scope-policy: none
      x-billing-code: null
      x-offering: triggers
      x-feature-flag: PUBLIC_TRIGGERS_API_ENABLED
      x-idempotency: webhook-payload-dedup
  /v1/triggers/health:
    get:
      tags:
      - Triggers
      operationId: triggersHealth
      summary: Triggers API health check
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      x-auth-mode: public
      x-required-scope: null
      x-required-scopes: []
      x-scope-policy: none
      x-billing-code: null
      x-offering: triggers
      x-feature-flag: null
      x-idempotency: none
components:
  schemas:
    WebhookFireResponse:
      type: object
      required:
      - received
      - schedule_id
      - message
      - request_id
      properties:
        received:
          type: boolean
        schedule_id:
          type: string
        run_id:
          type:
          - string
          - 'null'
        deduplicated:
          type: boolean
          default: false
        message:
          type: string
        request_id:
          type: string
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
        api_version:
          type: string
        service:
          type: string
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - type
          - retryable
          - retry_with_same_idempotency_key
          - request_id
          properties:
            code:
              type: string
              description: Stable machine-readable error code (e.g. INVALID_API_KEY, INSUFFICIENT_CREDITS).
              examples:
              - INVALID_API_KEY
            message:
              type: string
              description: Human-readable explanation. May include suggestions or examples.
            type:
              type: string
              enum:
              - auth_error
              - validation_error
              - rate_limit_error
              - billing_error
              - not_found_error
              - state_error
              - server_error
              - client_error
            request_id:
              type: string
              description: Server-assigned correlation ID. Include in support requests.
              examples:
              - req_a1b2c3d4e5f6
            suggestion:
              type: string
              description: A concrete next step, auto-filled per code. LLM agents can act on it to self-recover.
            retryable:
              type: boolean
              description: 'true when retrying the same call may succeed (transient server failures + back-pressure: INTERNAL_ERROR, DB_UNAVAILABLE, SERVICE_UNAVAILABLE, UPSTREAM_*, PREDICTION_FAILED, *_FAILED, RATE_LIMITED, TOO_MANY_RUNS, IDEMPOTENCY_IN_FLIGHT, ...). false for deterministic client errors. A CUA BILLING_UNAVAILABLE caused by refund uncertainty is false unless the server confirmed a shared recovery checkpoint. Present on EVERY error envelope, including gateway/5xx/timeout paths.'
            retry_with_same_idempotency_key:
              type: boolean
              description: 'true only when the concrete response permits replay and the original request already carried the key. This covers the exact 18 generic reserve-and-replay operations plus the separate account-scoped external-enrollment replay domain. Reuse that SAME key with its identical bound inputs. A retryable error alone does not make an operation idempotent, and a key cannot be added retroactively. For CUA refund uncertainty this is true only after an exact shared checkpoint was confirmed; unkeyed or uncheckpointed responses are false and must not be retried automatically. A confirmed refunded failure sets this false even when retryable remains true: use a new key, because the old debit is compensated and wallet-guarded by IDEMPOTENCY_ALREADY_REFUNDED. false for deterministic errors.'
            retry_after:
              type:
              - integer
              - 'null'
              description: Seconds to wait before retrying (accompanies retryable:true back-pressure codes; mirrors the Retry-After header).
            rule:
              type: string
              enum:
              - max_actions
              - structured_action
              - allowed_actions
              - blocked_actions
              - blocked_keys
              - block_window_close
              - coordinate_bounds
              description: Present on ACTION_POLICY_VIOLATION errors and identifies the enforced policy rule.
            action_index:
              type: integer
              minimum: 0
              description: Zero-based proposed-action index on ACTION_POLICY_VIOLATION when the rule is attributable to one action; omitted for batch-level rules such as max_actions.
            action_type:
              type: string
              description: Proposed action type on ACTION_POLICY_VIOLATION when attributable to one action; omitted for batch-level or uninspectable values.
            examples:
              type: object
              additionalProperties: true
              description: 'Machine-readable limits for self-correction. On PAYLOAD_TOO_LARGE / INVALID_SCREENSHOT: { max_base64_bytes: 10485760 (legacy name), max_base64_chars: 10485760, max_request_body_bytes: 15728640, max_mb: 10, min_base64_chars: 100, formats: ["png","jpeg"] }.'
    DeleteTriggerResponse:
      type: object
      required:
      - deleted
      - trigger_id
      - request_id
      properties:
        deleted:
          type: boolean
        trigger_id:
          type: string
        request_id:
          type: string
    TriggerResponse:
      type: object
      required:
      - id
      - schedule_id
      - kind
      - enabled
      - created_at
      properties:
        id:
          type: string
        schedule_id:
          type: string
        kind:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        webhook_url:
          type:
          - string
          - 'null'
        webhook_secret:
          type:
          - string
          - 'null'
          description: HMAC secret. Returned on creation and identical idempotent replays. Stored only as versioned AES-GCM ciphertext.
        email_address:
          type:
          - string
          - 'null'
        source_schedule_id:
          type:
          - string
          - 'null'
        event:
          type:
          - string
          - 'null'
    TriggerCreateRequest:
      type: object
      required:
      - kind
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
          - webhook
          - chain
        source_schedule_id:
          type:
          - string
          - 'null'
          maxLength: 64
        event:
          type: string
          enum:
          - on_complete
          - on_failure
          - on_any
          default: on_complete
        pass_output:
          type: boolean
          default: true
        rate_limit_per_minute:
          type: integer
          minimum: 1
          maximum: 600
          default: 60
        enabled:
          type: boolean
          default: true
    TriggerListItem:
      type: object
      required:
      - id
      - schedule_id
      - kind
      - enabled
      - created_at
      description: Persisted trigger view. webhook_secret is returned only by creation or its exact bounded Idempotency-Key replay and is deliberately absent from GET/list views.
      properties:
        id:
          type: string
        schedule_id:
          type: string
        kind:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        webhook_url:
          type:
          - string
          - 'null'
        email_address:
          type:
          - string
          - 'null'
        source_schedule_id:
          type:
          - string
          - 'null'
        event:
          type:
          - string
          - 'null'
    ListTriggersResponse:
      type: object
      required:
      - data
      - request_id
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TriggerListItem'
        request_id:
          type: string
  responses:
    RateLimited:
      description: Rate or concurrency limit exceeded.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-Coasty-Request-Id:
          $ref: '#/components/headers/CoastyRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Credits-Charged:
          $ref: '#/components/headers/CreditsCharged'
        X-Credits-Refunded:
          $ref: '#/components/headers/CreditsRefunded'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: An error occurred. See `code` for details.
              type: validation_error
              request_id: req_a1b2c3d4e5f6
              retryable: false
              retry_with_same_idempotency_key: false
    ServerError:
      description: Unexpected server error. Retry with exponential backoff.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-Coasty-Request-Id:
          $ref: '#/components/headers/CoastyRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Credits-Charged:
          $ref: '#/components/headers/CreditsCharged'
        X-Credits-Refunded:
          $ref: '#/components/headers/CreditsRefunded'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: INTERNAL_ERROR
              message: An error occurred. See `code` for details.
              type: validation_error
              request_id: req_a1b2c3d4e5f6
              retryable: false
              retry_with_same_idempotency_key: false
    WebhookUnauthorized:
      description: Missing, malformed, stale, or invalid Coasty-Signature HMAC for this webhook payload.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        X-Coasty-Request-Id:
          $ref: '#/components/headers/CoastyRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Credits-Charged:
          $ref: '#/components/headers/CreditsCharged'
        X-Credits-Refunded:
          $ref: '#/components/headers/CreditsRefunded'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: INVALID_SIGNATURE
              message: An error occurred. See `code` for details.
