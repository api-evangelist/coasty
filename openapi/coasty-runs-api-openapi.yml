      operationId: getTask
      summary: Get a task
      description: 'Scope: `runs:read`. Free. Reads back the task you submitted with `POST /v1/tasks`, using the id that call returned. A task IS a run, so the payload is identical to `GET /v1/runs/{run_id}` and either path may be polled.'
