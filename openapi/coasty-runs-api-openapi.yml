openapi: 3.2.0
info:
  title: Coasty Public Runs API
  version: 1.0.0
  summary: Computer Use Agents, scheduled automation, and managed VMs.
  description: '# Coasty Public API


    Coasty is a Computer Use Agent (CUA) platform: predict actions from screenshots,

    provision managed VMs, and run scheduled automation against them. ## Authentication


    All endpoints (except `/v1/triggers/webhook/{webhook_id}` and health checks) require an API key. Pass it as either:


    - `X-API-Key: sk-coasty-live-...` (or `sk-coasty-test-...` for sandbox)

    - `Authorization: Bearer sk-coasty-live-...`


    The external webhook endpoint does not use an API key, but it is authenticated:

    send the HMAC-SHA256 `Coasty-Signature` credential documented on that operation. Test-mode keys (`sk-coasty-test-*`) preserve the same core schemas for documented

    sandbox-supported operations and never debit Coasty credits. With a test Coasty key,

    explicit BYOK is provider-direct only for the direct CUA flow: `POST /v1/predict`,

    `POST /v1/ground`, `POST /v1/sessions`, and `POST /v1/sessions/{id}/predict`. Predict, ground, and session create require an explicit per-request X-LLM-Api-Key plus

    X-LLM-Provider under test auth. A body provider without that header returns 422

    LLM_KEY_NOT_CONFIGURED: Stored provider keys are unavailable for test API keys. Send

    X-LLM-Api-Key explicitly for direct BYOK. Test auth never reads or uses a stored live provider

    key. Session create fixes that explicit key for

    inherited predicts but makes no inference call. Predict, ground, and session predict can bill

    the supplied provider account. Managed-mode Task runs, Workflow runs, and schedules remain

    deterministic sandbox. BYOK intent on those async endpoints returns 422

    LLM_PROVIDER_UNSUPPORTED before execution: BYOK is unavailable for synthetic test runs,

    workflows, and schedules. Use managed mode or a live Coasty API key. They never decrypt or

    require a stored provider key and do not call or bill Anthropic/OpenAI. Live-only stored BYOK-key access or mutation is unavailable to test keys. Keep real provider

    secrets out of sandbox and CI requests, and use a live Coasty key for real async execution. ## Pricing & budgeting


    Published base rates and defaults (read effective deployed CUA/task pricing at

    `GET /v1/models` → `pricing`, and machine runtime pricing at `GET /v1/machines/pricing`):


    | Endpoint | Credits |

    |---|---|

    | `POST /v1/predict` | Managed: 5 base; BYOK: 0 |

    | `POST /v1/sessions` | Managed: 10 fixed; BYOK: 0 |

    | `POST /v1/sessions/{id}/predict` | Managed: 4 base; BYOK: 0 |

    | `POST /v1/ground` | Managed: 3 base; BYOK: 0 |

    | `POST /v1/parse` | 0 (free) |


    Predict and session-predict can add provider-visible trajectory-image, HD current/trajectory

    image, v1-engine, and combined system_prompt + trimmed-instructions (>500 chars) surcharges. Ground can add only the current-image HD surcharge; session creation has no surcharge. Managed-model published defaults: scheduled CUA execution bills the consumer subscription-credit balance

    at 10 credits/minute with a 20-credit start minimum for non-Unlimited accounts. Unlimited

    bypasses that runtime credit meter/start gate but retains token and concurrency safeguards. Managed schedule create/run-now use a $0.20 API-wallet eligibility gate. BYOK schedules

    bypass that gate and the runtime credit meter and debit zero Coasty platform credits. Live-key schedule execution is provider-billed. Managed-mode test execution is deterministic sandbox; test-auth BYOK intent returns 422 LLM_PROVIDER_UNSUPPORTED. Read `GET /v1/models` →

    `pricing.schedules` for effective values, plan applicability, and webhook policy. Your subscription tier (`free | starter | professional | enterprise`) is

    reported on the key, but the developer API is PREPAID: what bounds you is your

    credit balance, not your plan. Custom prompts in particular are NOT tier-gated. `system_prompt` and `instructions` are available on every tier including free,

    against a budget of 32,000 characters SHARED between the two fields (the sum is

    measured, and exceeding it returns 400 INPUT_TOO_LARGE).'
  contact:
    name: Coasty Developer Support
    url: https://coasty.ai/support
    email: founders@coasty.ai
  license:
    name: MIT
    identifier: MIT
  termsOfService: https://coasty.ai/terms
servers:
- url: https://coasty.ai
  description: Production
- url: https://coasty.ai
  description: Sandbox — use sk-coasty-test-* keys against the same host. No Coasty billing. Explicit-header BYOK can call the provider only for predict, ground, and inherited session predict; session create fixes the header key without inference, and test auth never reads a stored live key. Managed-mode Tasks, Workflows, and schedules remain deterministic sandbox. BYOK intent on those async endpoints returns 422 LLM_PROVIDER_UNSUPPORTED before execution and makes no provider call.
security:
- apiKey: []
- bearerAuth: []
tags:
- name: Runs
  description: Autonomous task runs — the agent drives a task to completion on a machine.
paths:
  /v1/tasks:
    post:
      tags:
      - Runs
      operationId: createAutonomousTask
      summary: Submit a task and let Coasty handle everything
      description: 'Scope: `runs:write`. The high-level submit-and-forget API. Coasty asynchronously provisions an ephemeral managed desktop, runs the screenshot→act→observe→verify loop, refuses human takeover, and never enters awaiting_human. A handoff request is suppressed and the agent is told to carry on with a fresh screen: there is no retry budget and no challenge-specific terminal error, so a verification screen, CAPTCHA or email confirmation is treated as part of the task. max_steps, deadline_seconds and the credit balance are the only hard stops. Credentials, inboxes and codes supplied in the task are the agent''s to use — fetching a confirmation code from an inbox you provided is ordinary work, not an escalation. Coasty does not provide or integrate third-party CAPTCHA solvers, stealth/proxy evasion, access-control bypasses, or fabricated authority, and the agent is explicitly prohibited from using them. Per-step model-input frames are retained for every run and readable at GET /v1/runs/{run_id}/screenshots, and the assembled step-by-step trajectory (reasoning, actions, outcomes) at GET /v1/runs/{run_id}/log — which is where you read a finished run''s full trajectory or final answer, since result.summary is only the last 2000 characters. It records a terminal succeeded/failed/timed_out outcome, starts idempotent machine cleanup, and sends the optional HMAC-signed webhook. Webhook delivery can precede completed provider termination, so inspect machine.cleanup_status (terminating, retrying, or terminated). The admission response is immediate and uses the normal agent.run resource, so GET /v1/runs/{id}, cancellation, and SSE remain available but are not required when a webhook is supplied. Idempotency-Key deduplicates task admission and machine provisioning. Managed CUA steps and machine runtime are billed normally; BYOK makes LLM execution zero Coasty platform credits but does not make machine runtime free.'
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XLLMProvider'
      - $ref: '#/components/parameters/XLLMApiKey'
      - $ref: '#/components/parameters/XLLMModel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutonomousTaskRequest'
      responses:
        '200':
          description: Task accepted (agent.run status "queued").
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
            X-Coasty-Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Idempotency-Status:
              $ref: '#/components/headers/IdempotencyStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: runs:write
      x-required-scopes:
      - runs:write
      x-scope-policy: required
      x-billing-code: run_step
      x-offering: runs
      x-feature-flag: RUNS_API_ENABLED
      x-idempotency: reserve-and-replay
  /v1/runs:
    post:
      tags:
      - Runs
      operationId: createRun
      summary: Start an autonomous run
      description: 'Scope: `runs:write`. Drives `task` to completion on `machine_id`, running the screenshot→act→verify loop server-side. Managed defaults charge 5 credits per completed agent step on v3/v4/v5 and 8 on v1. With a live Coasty key, BYOK runs every role on YOUR provider key and debits zero Coasty platform credits for creation and every step, while persisting actual provider tokens; no wallet runway is required. Under test auth, a managed-mode run remains deterministic sandbox execution. Any BYOK header or provider metadata instead returns 422 LLM_PROVIDER_UNSUPPORTED before execution: BYOK is unavailable for synthetic test runs, workflows, and schedules. Use managed mode or a live Coasty API key. Test execution never decrypts or requires a stored provider key and does not call or bill Anthropic/OpenAI. Run steps do not inherit /v1/predict trajectory, HD-image, or combined-prompt surcharges. Idempotency-Key deduplicates top-level creation, not later GUI/terminal/file side effects. `webhook_secret` is returned only by create/replay; a live BYOK key snapshot is encrypted for crash recovery and scrubbed at terminal state.'
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XLLMProvider'
      - $ref: '#/components/parameters/XLLMApiKey'
      - $ref: '#/components/parameters/XLLMModel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
      responses:
        '200':
          description: Run created (status "queued").
          content:
            application/json:
              schema:
