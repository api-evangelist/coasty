        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: runs:write
      x-required-scopes:
      - runs:write
      x-scope-policy: required
      x-billing-code: run_step
      x-offering: runs
      x-feature-flag: RUNS_API_ENABLED
      x-idempotency: reserve-and-replay
    get:
      tags:
      - Runs
      operationId: listRuns
      summary: List runs
      description: 'Scope: `runs:read`. Free. Optional `status` filter and `limit` (1-200, default 20).'
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - queued
          - running
          - awaiting_human
          - succeeded
          - failed
          - cancelled
          - timed_out
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 20
      responses:
        '200':
          description: A list of runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRunsResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
