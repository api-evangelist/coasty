  /v1/runs/{run_id}/log:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      tags:
      - Runs
      operationId: getRunLog
      summary: Read what a run actually did, step by step
      description: 'Scope: `runs:read`. Free. **This is the supported way to read a finished run''s full trajectory or its final answer.** `GET /v1/runs/{run_id}/events` streams the same source over SSE, which suits watching a run live but makes inspecting a completed one awkward; `result.summary` on the run object is only the last 2000 characters.


        Each step arrives assembled: the model''s reasoning already unwrapped from its `` markup (`analysis`, `next_action`, `grounded_action`, `action_result`), then every action with its coordinates and outcome, plus what the step cost and the `screenshot_index` of the frame the agent saw before acting. No parsing required. Pass `include_events=true` to also get the raw events, nested inside the step they belong to.


        **Read `log_complete` before concluding anything from an absence.** The event log is BEST EFFORT and is not written inside the run''s transaction, so a step can execute and be billed while its log rows are lost. When `log_complete` is false, `steps_completed` is the authoritative count and a step missing here did not necessarily fail to happen.


        Page with `after_step`. `lifecycle` is returned whole on every page because it is small and usually contains the reason the run stopped.


        Errors: 404 RUN_NOT_FOUND for an unknown or cross-tenant run (ownership is checked first, so a run you do not own is never revealed as an empty log). 503 DB_UNAVAILABLE with Retry-After when the event store is failing.'
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        description: Steps per page. Outside 1..200 returns 400 INVALID_LIMIT.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: after_step
        in: query
        required: false
        description: Return steps with a step number strictly greater than this. Negative values return 400 INVALID_EVENT_CURSOR.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: include_events
        in: query
        required: false
        description: Nest the raw events each step was folded from inside that step.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A page of assembled steps, plus run-level lifecycle events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRunLogResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: runs:read
