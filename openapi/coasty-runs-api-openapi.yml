components:
  schemas:
    LlmConfig:
      type: object
      additionalProperties: false
      description: 'Opt-in BYOK model selection. provider ''managed'' (or omitting llm) keeps the platform default. There is deliberately no api_key field (422 if attempted): keys ride the X-LLM-Api-Key header or the encrypted /v1/llm/keys store only. Once BYOK is requested there is NO silent fallback to Coasty''s platform LLM keys.'
      properties:
        provider:
          type: string
          enum:
          - managed
          - anthropic
          - openai
          default: managed
          description: Whose LLM account runs the harness. Anything else is 422 LLM_PROVIDER_UNSUPPORTED.
        model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: 'Main worker model. Defaults: claude-sonnet-5 (anthropic), gpt-5.6-sol (openai). Model ids are 1-256 characters, begin with a letter or number, and then use only letters, numbers, dot, underscore, colon, slash, plus, at-sign, or hyphen; invalid ids return 422 LLM_MODEL_INVALID. The selected provider can still reject an unknown or inaccessible model. It must be vision-capable.'
        grounding_model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: Override for pixel-coordinate grounding. Defaults to model. Grounding quality is tuned on the platform model; expect best results with the defaults.
        compaction_model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: Override for trajectory compaction. Defaults to model. A cheaper model here is the classic cost tune.
        code_agent_model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: Override for the code agent. Defaults to model.
    RunStepDetail:
      type: object
      description: Everything that happened in one agent step, already assembled. The underlying store is a flat event log; the reasoning text in particular arrives wrapped in <cua-section> markup, and this view has already unwrapped it.
      properties:
        step:
          type: integer
        attempt:
          type: integer
          default: 1
          description: A run that was reaped and re-claimed restarts its step counter at 1, so `step` alone is not a unique address within a run. Pair it with `attempt`.
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        analysis:
          type:
          - string
          - 'null'
          description: The model's own account of what it was looking at, unwrapped from its <cua-section> markup. Any reasoning section may be absent.
        next_action:
          type:
          - string
          - 'null'
        grounded_action:
          type:
          - string
          - 'null'
        action_result:
          type:
          - string
          - 'null'
          description: 'What the screen actually did in response, as the agent recorded it (e.g. "Double-clicked at (70, 527)" or "no screen change detected"). The most useful field for diagnosing a stuck run: it is where "the click landed but nothing happened" becomes visible.'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/RunAction'
          description: Every tool call in this step, in order, with coordinates and outcome.
        credits_charged:
          type: integer
          default: 0
        cost_cents:
          type: integer
          default: 0
        screenshot_index:
          type:
          - integer
          - 'null'
          description: Flat index into GET /v1/runs/{run_id}/screenshots for the frame the agent saw BEFORE acting, when one was captured for this step.
        error:
          type:
          - string
          - 'null'
        events:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RunEvent'
          description: The raw events this step was folded from. Present only with include_events=true. Nested under the step rather than returned as a parallel array, so a page boundary can never split a step from its events.
    CoordinateBounds:
      type: object
      required:
      - max_x
      - max_y
      additionalProperties: false
      description: Inclusive coordinate rectangle in the request screenshot's pixel space.
      properties:
        min_x:
          type: integer
          minimum: 0
          maximum: 3840
          default: 0
        min_y:
          type: integer
          minimum: 0
          maximum: 2160
          default: 0
        max_x:
          type: integer
          minimum: 0
          maximum: 3840
        max_y:
          type: integer
          minimum: 0
          maximum: 2160
    ListRunsResponse:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          enum:
          - list
        data:
          type: array
          items:
            $ref: '#/components/schemas/RunResponse'
        has_more:
          type: boolean
          default: false
        request_id:
          type: string
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - type
          - retryable
          - retry_with_same_idempotency_key
          - request_id
          properties:
            code:
              type: string
              description: Stable machine-readable error code (e.g. INVALID_API_KEY, INSUFFICIENT_CREDITS).
              examples:
              - INVALID_API_KEY
            message:
              type: string
              description: Human-readable explanation. May include suggestions or examples.
            type:
              type: string
              enum:
              - auth_error
              - validation_error
              - rate_limit_error
              - billing_error
              - not_found_error
              - state_error
              - server_error
              - client_error
            request_id:
              type: string
              description: Server-assigned correlation ID. Include in support requests.
              examples:
              - req_a1b2c3d4e5f6
            suggestion:
              type: string
              description: A concrete next step, auto-filled per code. LLM agents can act on it to self-recover.
            retryable:
              type: boolean
              description: 'true when retrying the same call may succeed (transient server failures + back-pressure: INTERNAL_ERROR, DB_UNAVAILABLE, SERVICE_UNAVAILABLE, UPSTREAM_*, PREDICTION_FAILED, *_FAILED, RATE_LIMITED, TOO_MANY_RUNS, IDEMPOTENCY_IN_FLIGHT, ...). false for deterministic client errors. A CUA BILLING_UNAVAILABLE caused by refund uncertainty is false unless the server confirmed a shared recovery checkpoint. Present on EVERY error envelope, including gateway/5xx/timeout paths.'
            retry_with_same_idempotency_key:
              type: boolean
              description: 'true only when the concrete response permits replay and the original request already carried the key. This covers the exact 18 generic reserve-and-replay operations plus the separate account-scoped external-enrollment replay domain. Reuse that SAME key with its identical bound inputs. A retryable error alone does not make an operation idempotent, and a key cannot be added retroactively. For CUA refund uncertainty this is true only after an exact shared checkpoint was confirmed; unkeyed or uncheckpointed responses are false and must not be retried automatically. A confirmed refunded failure sets this false even when retryable remains true: use a new key, because the old debit is compensated and wallet-guarded by IDEMPOTENCY_ALREADY_REFUNDED. false for deterministic errors.'
            retry_after:
              type:
              - integer
              - 'null'
              description: Seconds to wait before retrying (accompanies retryable:true back-pressure codes; mirrors the Retry-After header).
            rule:
              type: string
              enum:
              - max_actions
              - structured_action
              - allowed_actions
              - blocked_actions
              - blocked_keys
              - block_window_close
              - coordinate_bounds
              description: Present on ACTION_POLICY_VIOLATION errors and identifies the enforced policy rule.
            action_index:
              type: integer
              minimum: 0
              description: Zero-based proposed-action index on ACTION_POLICY_VIOLATION when the rule is attributable to one action; omitted for batch-level rules such as max_actions.
            action_type:
              type: string
              description: Proposed action type on ACTION_POLICY_VIOLATION when attributable to one action; omitted for batch-level or uninspectable values.
            examples:
              type: object
              additionalProperties: true
              description: 'Machine-readable limits for self-correction. On PAYLOAD_TOO_LARGE / INVALID_SCREENSHOT: { max_base64_bytes: 10485760 (legacy name), max_base64_chars: 10485760, max_request_body_bytes: 15728640, max_mb: 10, min_base64_chars: 100, formats: ["png","jpeg"] }.'
    RunLlmInfo:
      type: object
      additionalProperties: false
      required:
      - provider
      - model
      - key_fingerprint
      - key_source
      - key_scrubbed
      properties:
        provider:
          type: string
          enum:
          - anthropic
          - openai
        model:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
        key_fingerprint:
          type: string
          minLength: 12
          maxLength: 12
          pattern: ^[0-9a-f]{12}$
        key_source:
          type: string
          enum:
          - header
          - stored
        key_scrubbed:
          type: boolean
      description: Credential-free BYOK attribution returned by agent runs and workflow runs. Only these allowlisted fields are public.
    AutonomousTaskRequest:
      type: object
      required:
      - task
      additionalProperties: false
      properties:
        task:
          type: string
          minLength: 1
          maxLength: 16000
        cua_version:
          type: string
          enum:
          - v1
          - v3
          - v4
          - v5
          default: v5
        instructions:
          type:
          - string
          - 'null'
          maxLength: 16000
        system_prompt:
          type:
          - string
          - 'null'
          maxLength: 32000
        model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
        max_steps:
          type: integer
          minimum: 1
          maximum: 1000
          default: 150
        action_policy:
          $ref: '#/components/schemas/ActionPolicy'
        deadline_seconds:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 86400
        webhook_url:
          type:
          - string
          - 'null'
          maxLength: 2048
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        llm:
          $ref: '#/components/schemas/LlmConfig'
        machine:
          $ref: '#/components/schemas/AutonomousMachineRequest'
    ResumeRunRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type:
          - string
          - 'null'
          maxLength: 2000
          description: Recorded on the run timeline.
    RunRequest:
      type: object
      required:
      - machine_id
      - task
      additionalProperties: false
      properties:
        machine_id:
          type: string
          minLength: 1
          maxLength: 128
          description: Target managed or connected external machine id (must be owned by the key's user).
        task:
          type: string
          minLength: 1
          maxLength: 16000
          description: Natural-language task to drive to completion.
        cua_version:
          type: string
          enum:
          - v1
          - v3
          - v4
          - v5
          default: v5
          description: CUA engine version. Defaults to the latest (v5); available on all tiers.
        instructions:
          type:
          - string
          - 'null'
          maxLength: 16000
          description: Appended to the base agent prompt.
        system_prompt:
          type:
          - string
          - 'null'
          maxLength: 32000
          description: Custom preamble prepended to the task; it does not replace the built-in tool-aware agent system prompt. Shares the tier custom-prompt budget with instructions.
        model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: Legacy top-level model selection (prefer llm.model for BYOK). Model ids are 1-256 characters, begin with a letter or number, and then use only letters, numbers, dot, underscore, colon, slash, plus, at-sign, or hyphen. Secret-shaped values such as sk-* keys, bearer credentials, authorization values, or API-key/secret assignments are rejected without reflection as 422 LLM_MODEL_INVALID; provider credentials belong only in X-LLM-Api-Key.
        max_steps:
          type: integer
          minimum: 1
          maximum: 1000
          default: 150
          description: Hard cap on agent steps (clamped to the server ceiling).
        action_policy:
          $ref: '#/components/schemas/ActionPolicy'
          description: Immutable policy inherited by the complete task execution tree, including nested delegation and worker recovery.
        deadline_seconds:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 86400
          description: Wall-clock budget in seconds (clamped).
        on_awaiting_human:
          type: string
          enum:
          - pause
          - fail
          - cancel
          default: pause
          description: Behaviour when the agent needs a human.
        awaiting_human_timeout_seconds:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 86400
        webhook_url:
          type:
          - string
          - 'null'
          maxLength: 2048
          description: HTTPS URL for HMAC-signed run-event deliveries.
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Opaque key/value map echoed back (≤50 keys).
        llm:
          $ref: '#/components/schemas/LlmConfig'
    ListRunScreenshotsResponse:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          enum:
          - list
        data:
          type: array
          items:
            $ref: '#/components/schemas/RunScreenshot'
        has_more:
          type: boolean
          default: false
        request_id:
          type: string
    ProxyRequest:
      type: object
      additionalProperties: false
      description: Route a machine's outbound traffic through a proxy. 'managed' uses Coasty's residential upstream and takes no other fields; 'custom' requires host and port. Omit the object entirely for no proxy.
      properties:
        mode:
          type: string
          enum:
          - none
          - managed
          - custom
          default: none
        session:
          type:
          - string
          - 'null'
          enum:
          - sticky
          - rotating
          description: Managed mode only. 'sticky' (default) holds one exit IP for the machine's lifetime.
        scheme:
          type:
          - string
          - 'null'
          enum:
          - http
          - https
          - socks5
          description: 'Custom mode only. How to reach YOUR PROXY, not what it can carry: an http proxy serves HTTPS sites fine through CONNECT. Use https only when the proxy itself terminates TLS. Defaults to http.'
        host:
          type:
          - string
          - 'null'
          maxLength: 253
          description: Custom mode only. Must be a public address; loopback, link-local and private ranges are refused.
        port:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 65535
        username:
          type:
          - string
          - 'null'
          maxLength: 512
        password:
          type:
          - string
          - 'null'
          maxLength: 512
          description: Write-only. Encrypted at rest and never returned by any endpoint.
    RunEvent:
      type: object
      description: 'One entry from a run''s append-only event log, as returned in JSON by GET /v1/runs/{run_id}/log.


        Over SSE the same entry is split across the frame rather than sent as this object: `id:` carries `seq`, the event name carries `type`, and the `data:` field carries ONLY the inner `data` payload. Do not expect `seq` or `type` inside a parsed SSE `data:` body.'
      properties:
        seq:
          type: integer
          description: Monotonic cursor; pass via Last-Event-ID or ?after= to resume an SSE stream.
        type:
          type: string
          description: Event type (e.g. status, step, awaiting_human, done).
        data:
          type: object
          additionalProperties: true
        created_at:
          type:
          - string
          - 'null'
          format: date-time
    ListRunLogResponse:
      type: object
      required:
      - object
      - data
      description: 'The assembled log for one run: one record per agent step, plus the run-level events that belong to no step.'
      properties:
        object:
          type: string
          enum:
          - list
        data:
          type: array
          items:
            $ref: '#/components/schemas/RunStepDetail'
        lifecycle:
          type: array
          items:
            $ref: '#/components/schemas/RunEvent'
          description: 'Events that belong to the run rather than to any step: queued/running/done transitions, run-level errors, awaiting-human pauses. A step-shaped view would silently drop these, and they are usually the ones that explain why a run stopped. Returned whole on every page because it is small.'
        has_more:
          type: boolean
          default: false
        next_after_step:
          type:
          - integer
          - 'null'
          description: 'Cursor: pass as after_step to continue. null when the log is complete.'
        live:
          type: boolean
          default: false
          description: True when the run is still going, so the log will grow.
        steps_completed:
          type: integer
          default: 0
          description: 'Authoritative count from the run record: how many steps actually ran. Trust this over the length of `data`.'
        steps_logged:
          type: integer
          default: 0
          description: How many steps this log could reconstruct any evidence for.
        log_complete:
          type: boolean
          default: true
          description: 'False when the log is missing steps the run is known to have executed. The event log is BEST EFFORT: appends are not part of the run''s transaction, so a step can execute and be billed while its log rows are lost. When this is false, `steps_completed` is authoritative and the absence of a step here is NOT evidence that it did not happen.'
        request_id:
          type: string
    RunAction:
      type: object
      required:
      - seq
      - tool
      description: One thing the agent did to the machine, and whether it worked.
      properties:
        seq:
          type: integer
        tool:
          type: string
          description: The action/tool name invoked.
        args:
          type: object
          additionalProperties: true
          description: Arguments as executed, including coordinates.
        ok:
          type:
          - boolean
          - 'null'
          description: 'The outcome the agent observed. null when the run ended before the result was recorded: a step cut off by a deadline or a crash has a call with no result, and reporting that as a failure would be a guess. An action in flight is genuinely different from one that failed.'
        error:
          type:
          - string
          - 'null'
          description: Present only when the agent reported a failure reason.
    RunScreenshot:
      type: object
      required:
      - index
      - attempt
      - step
      properties:
        index:
          type: integer
          description: 'Flat, monotonic position across the whole run. The stable address for a frame: `step` restarts at 1 on a retried attempt, so it is not unique on its own.'
        attempt:
          type: integer
          description: Which execution attempt produced this frame (1, 2, 3…). A run that was reaped and reclaimed has more than one.
        step:
          type: integer
          description: Step number within that attempt.
        taken_at:
          type:
          - string
          - 'null'
          format: date-time
        width:
          type: integer
          description: Model coordinate-space width — what the agent's clicks were computed against, not necessarily the machine's physical resolution.
        height:
          type: integer
        mime_type:
          type: string
          default: image/png
        size_bytes:
          type: integer
          description: Plaintext frame size.
        sha256:
          type:
          - string
          - 'null'
          description: SHA-256 of the plaintext frame, for dedup and integrity.
        degraded:
          type: boolean
          default: false
          description: True when capture failed and the agent had to act on a reused or placeholder frame.
        encrypted_at_rest:
          type: boolean
          default: false
        image_b64:
          type:
          - string
          - 'null'
          description: Base64 PNG. Present only with include_image=true.
        image_unavailable:
          type:
          - boolean
          - 'null'
          description: Set instead of image_b64 when a stored frame could not be decoded. One bad frame never fails the page.
    RunResponse:
      type: object
      required:
      - id
      - object
      - status
      properties:
        id:
          type: string
        object:
          type: string
          enum:
          - agent.run
        status:
          type: string
          enum:
          - queued
          - running
          - awaiting_human
          - succeeded
          - failed
          - cancelled
          - timed_out
        machine_id:
          type:
          - string
          - 'null'
        machine:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            mode:
              type: string
              enum:
              - automatic
            status:
              type: string
              enum:
              - provisioning
              - starting
              - reconciling
              - ready
              - terminated
              - cleanup_failed
              description: Lifecycle of the ephemeral machine Coasty created for this run. `starting` means the provider handle and billing record are durable but the desktop may still be booting; execution readiness is verified separately before the agent is allowed to start. `reconciling` means a provisioning outcome is being recovered from the provider journal, and the run keeps its lease while that resolves. `cleanup_failed` means the run reached a terminal outcome but teardown did not confirm.
            id:
              type:
              - string
              - 'null'
            cleanup:
              type: string
              enum:
              - always
            cleanup_status:
              type: string
              enum:
              - pending
              - terminating
              - retrying
              - terminated
            error:
              type: object
              additionalProperties: true
        task:
          type: string
        cua_version:
          type: string
        instructions:
          type:
          - string
          - 'null'
        max_steps:
          type: integer
        deadline_seconds:
          type: integer
          description: 'EFFECTIVE wall-clock budget after the server applied its ceiling. Echoed back so a clamp is never silent: request 86400 against a lower server ceiling and you see the value the run is actually held to, instead of discovering it as a surprise DEADLINE_EXCEEDED.'
        awaiting_human_timeout_seconds:
          type: integer
          description: EFFECTIVE awaiting-human timeout after the server applied its ceiling, echoed back for the same reason as deadline_seconds.
        on_awaiting_human:
          type: string
        steps_completed:
          type: integer
        credits_charged:
          type: integer
        cost_cents:
          type: integer
        result:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: 'Terminal outcome envelope: `passed` (boolean), `status`, `summary`, `usage`, and `verdict` only when a verifier pass ran. `summary` is the LAST 2000 characters of the trajectory, so it carries the agent''s final answer; it is not the full trajectory and there is no `output` field. To read a complete trajectory, or a final answer you intend to parse, use GET /v1/runs/{run_id}/log.'
        error:
          type:
          - object
          - 'null'
          additionalProperties: true
        awaiting_human_reason:
          type:
          - string
          - 'null'
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        llm:
          description: 'Non-secret BYOK echo when the run opted into the caller''s own key: {provider, model, key_fingerprint, key_source, key_scrubbed}. key_source is ''stored'' or ''header''; key_scrubbed flips to true when the encrypted snapshot is destroyed at terminal state. Never contains the key.'
          oneOf:
          - $ref: '#/components/schemas/RunLlmInfo'
          - type: 'null'
        webhook_url:
          type:
          - string
          - 'null'
          description: Lifecycle callback destination. Agent Run terminal callbacks are transactionally queued in a durable outbox and delivered at least once, with at most 3 durably recorded delivery attempts. A crash after HTTP send but before durable acknowledgement can add duplicate physical sends. Stable Coasty-Delivery equals body id and logical delivered_at survives retries; receivers must deduplicate it. The non-terminal awaiting-human callback is best-effort in-process, can be missed on a worker failure, and uses (run.id, event, run.awaiting_human_since) for deduplication. GET the run for authoritative state.
        webhook_secret:
          type:
          - string
          - 'null'
          description: Returned by create and its exact bounded Idempotency-Key replay; null on get/list. The pinned per-run secret is encrypted at rest through delivery/replay recovery and later scrubbed. Verify raw-body deliveries with HMAC-SHA256 before accepting the Coasty-Delivery deduplication key.
        created_at:
          type:
          - string
          - 'null'
        started_at:
          type:
          - string
          - 'null'
        awaiting_human_since:
          type:
          - string
          - 'null'
        finished_at:
          type:
          - string
          - 'null'
        request_id:
          type:
          - string
          - 'null'
    AutonomousMachineRequest:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          enum:
          - auto
          - aws
          - daytona
          - azure
          default: auto
          description: 'Which backend runs this task''s machine. ''auto'' (default) lets Coasty choose: a desktop or Windows task goes to Daytona, falling back to AWS when Daytona is disabled; a headless task goes to Azure. Pin ''aws'' or ''daytona'' to force one. The choice is part of the run''s idempotency identity, so a replay lands on the same backend rather than silently migrating.'
        os_type:
          type: string
          enum:
          - linux
          - windows
          default: linux
        desktop_enabled:
          type: boolean
          default: true
        cpu_cores:
          type: integer
          minimum: 1
          maximum: 16
        memory_gb:
          type: integer
          minimum: 1
          maximum: 64
        storage_gb:
          type: integer
          minimum: 8
          maximum: 500
        restore_from_snapshot:
          type: boolean
          default: false
        proxy:
          $ref: '#/components/schemas/ProxyRequest'
      description: Optional workload preferences. Coasty creates the machine, assigns a fail-safe TTL, and destroys it after any terminal outcome. Leave `provider` unset to let Coasty choose the backend, or pin one.
    ActionPolicy:
      type: object
      additionalProperties: false
      description: Opt-in, fail-closed post-model action enforcement. The complete normalized batch is checked atomically before actions are returned or dispatched. allowed_actions and blocked_actions cannot overlap. Prediction, Session, and Parse surfaces use prediction action names such as type_text; direct Machine routes use command names such as type. Task, Workflow, and Schedule policies are create-time controls inherited across execution and recovery.
      properties:
        allowed_actions:
          type:
          - array
          - 'null'
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^\s*[A-Za-z][A-Za-z0-9_:-]{0,63}\s*$
          description: Optional action allowlist. Values are trimmed and lowercased before validation; duplicates after normalization are rejected. Terminal done/fail/awaiting_human signals remain allowed.
        blocked_actions:
          type: array
          maxItems: 128
          uniqueItems: true
          default: []
          items:
            type: string
            pattern: ^\s*[A-Za-z][A-Za-z0-9_:-]{0,63}\s*$
          description: Action denylist. Values are trimmed and lowercased before validation; duplicates after normalization are rejected.
        blocked_keys:
          type: array
          maxItems: 128
          uniqueItems: true
          default: []
          items:
            type: string
            pattern: ^\s*[A-Za-z0-9_+\-=\[\]\\;',./`]{1,64}\s*$
          description: Keys forbidden in key_press, key_combo, and modifier-bearing actions. Values are trimmed and lowercased; duplicates after normalization are rejected; esc aliases escape.
        block_window_close:
          type: boolean
          default: false
          description: Block explicit close commands and common Alt+F4, Ctrl/Cmd+W, and Cmd+Q shortcuts.
        max_actions:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
          description: Maximum number of actions admitted in one prediction/session step, parsed action batch, or direct Machine batch.
        coordinate_bounds:
          anyOf:
          - $ref: '#/components/schemas/CoordinateBounds'
          - type: 'null'
