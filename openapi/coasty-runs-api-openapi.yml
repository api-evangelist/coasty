          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: runs:read
      x-required-scopes:
      - runs:read
      x-scope-policy: required
      x-billing-code: null
      x-offering: runs
      x-feature-flag: RUNS_API_ENABLED
      x-idempotency: none
