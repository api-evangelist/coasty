  /v1/runs/{run_id}/screenshots:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      tags:
      - Runs
      operationId: listRunScreenshots
      summary: List run screenshots
      description: 'Scope: `runs:read`. Free. The model-input frames for a run, oldest first — the exact images the agent saw before each decision, which is what you want when reconstructing why it did something. Captured for every run, managed and BYOK alike.


        Metadata only by default: a single frame is several hundred KB of base64, so pass `include_image=true` to inline `image_b64` (page size is clamped to 10 in that mode, and the response is `Cache-Control: no-store` because frames can show whatever was on screen).


        Page with `after_index`. `index` is flat and monotonic across the WHOLE run and is the stable address for a frame: a run that was reaped and retried starts a new attempt whose `step` counter restarts at 1, so `step` alone is not unique — `attempt` tells you which try a frame belongs to. A frame whose stored bytes cannot be decoded is returned with `image_unavailable: true` rather than failing the page.'
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: after_index
        in: query
        required: false
        description: Return frames with index greater than or equal to this.
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: include_image
        in: query
        required: false
        description: 'Inline base64 PNG per frame. Clamps limit to 10 and sets Cache-Control: no-store.'
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: A page of run screenshots.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRunScreenshotsResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
        '400':
          $ref: '#/components/responses/BadRequest'
