    PredictRequest:
      type: object
      required:
      - screenshot
      - instruction
      additionalProperties: false
      description: Stateless screenshot-to-actions request. The current screenshot, every trajectory screenshot, and all remaining JSON together must fit the 15 MiB (15,728,640-byte) request-body cap; compress/downscale history or use a stateful session for long trajectories.
      dependentRequired:
        screen_width:
        - screen_height
        screen_height:
        - screen_width
      properties:
        screenshot:
          $ref: '#/components/schemas/ScreenshotBase64'
        instruction:
          type: string
          minLength: 1
          maxLength: 32000
          description: Natural-language task instruction. This task text is not counted toward the custom-prompt surcharge.
        cua_version:
          type: string
          enum:
          - v1
          - v3
          - v4
          - v5
          default: v5
          description: v1 = baseline full pipeline. v3 = lean, v4 = autonomous, v5 = latest/default. For managed stateless predict, v3/v4/v5 share the low-latency single-call planner; sessions, runs, workflows, and BYOK predictions use the selected full engine. Inspect GET /models managed_stateless_predict_mode.
        model:
          type:
          - string
          - 'null'
          enum:
          - default
          description: Managed model alias. For BYOK model selection use llm.model.
        system_prompt:
          type:
          - string
          - 'null'
          maxLength: 16000
          description: Optional custom prompt. Its full length plus trimmed instructions determines the custom-prompt surcharge; exactly the discovered threshold is free.
        instructions:
          type:
          - string
          - 'null'
          maxLength: 16000
          description: Optional appended guidance. Its trimmed length plus system_prompt determines the custom-prompt surcharge; task instruction is excluded.
        screen_width:
          type:
          - integer
          - 'null'
          minimum: 320
          maximum: 3840
          description: Omit to use the screenshot's true size (measured server-side); no longer defaults to 1920.
        screen_height:
          type:
          - integer
          - 'null'
          minimum: 240
          maximum: 2160
          description: Omit to use the screenshot's true size (measured server-side); no longer defaults to 1080.
        trajectory:
          type: array
          maxItems: 19
          description: Up to 19 prior screenshots; the current screenshot is the 20th provider image. Prior action coordinates use each step's declared dimensions or decoded image dimensions and are normalized server-side. All frames and JSON share the 15 MiB aggregate request cap, so compress or downscale history.
          items:
            $ref: '#/components/schemas/TrajectoryStep'
        max_actions:
          type: integer
          minimum: 1
          maximum: 10
          default: 5
        tools:
          type:
          - array
          - 'null'
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            enum:
            - click
            - type_text
            - key_press
            - key_combo
            - scroll
            - drag
            - move
            - wait
        action_policy:
          $ref: '#/components/schemas/ActionPolicy'
        include_reasoning:
          type: boolean
          default: true
        include_raw_code:
          type: boolean
          default: true
        llm:
          $ref: '#/components/schemas/LlmConfig'
