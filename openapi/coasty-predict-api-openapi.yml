        scheduler_timeout_seconds:
          type: integer
          minimum: 1
          description: Effective wall-clock timeout for one scheduled firing.
        credit_meter_applies_to:
          type: string
          const: non_unlimited_accounts
          description: The subscription-credit tariff and start-balance gate apply to accounts that are not on Unlimited.
        unlimited_credit_meter_bypass:
          type: boolean
          const: true
          description: Unlimited skips the subscription-credit start gate and deductions; its separate token throttle still applies.
    ScreenshotBase64:
      description: One static PNG/JPEG screenshot as raw base64 or an exact data:image/png;base64 / data:image/jpeg;base64 URI. Animated and multi-frame images are rejected. This per-image limit does not multiply the ordinary 15 MiB aggregate JSON request-body cap.
      oneOf:
      - type: string
        minLength: 100
        maxLength: 10485760
        pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
        title: Raw base64
      - type: string
        minLength: 122
        maxLength: 10485782
        pattern: ^data:image/png;base64,(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
        title: PNG data URI
      - type: string
        minLength: 123
        maxLength: 10485783
        pattern: ^data:image/jpeg;base64,(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
        title: JPEG data URI
