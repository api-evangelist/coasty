          - browser_get_clickables
          - browser_state
          - browser_info
          - browser_scroll
          - browser_close
          - browser_screenshot
          - browser_wait
          - browser_list_tabs
          - browser_open_tab
          - browser_close_tab
          - browser_switch_tab
          - browser_execute
          description: Canonical command name. GET /v1/models returns the same list in machine_action_commands for runtime discovery.
        parameters:
          type: object
          description: Command-specific strict object selected by the command discriminator. Max 1,000,000 serialized UTF-8 JSON bytes.
        timeout_ms:
          type:
          - integer
          - 'null'
          minimum: 1000
          maximum: 120000
        action_policy:
          $ref: '#/components/schemas/ActionPolicy'
        precondition_frame_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 'Required for every mutating external-machine action: the frame_id on which it was planned. A missing or stale frame is rejected instead of executing against changed pixels. Obtain it from GET /screenshot or the preceding action response. Read-only external commands may omit it; managed-machine transports ignore it.'
    GetMachineResponse:
      type: object
      required:
      - machine
      - request_id
      properties:
        machine:
          $ref: '#/components/schemas/MachineRecord'
        request_id:
          type: string
    ScreenshotBase64:
      description: One static PNG/JPEG screenshot as raw base64 or an exact data:image/png;base64 / data:image/jpeg;base64 URI. Animated and multi-frame images are rejected. This per-image limit does not multiply the ordinary 15 MiB aggregate JSON request-body cap.
      oneOf:
      - type: string
        minLength: 100
        maxLength: 10485760
        pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
        title: Raw base64
      - type: string
        minLength: 122
        maxLength: 10485782
        pattern: ^data:image/png;base64,(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
        title: PNG data URI
      - type: string
        minLength: 123
        maxLength: 10485783
        pattern: ^data:image/jpeg;base64,(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
        title: JPEG data URI
    MachineRecord:
      type: object
      required:
      - id
      - display_name
      - status
      - kind
      - capabilities
      - protocol_version
      - connection_status
      - last_seen_at
      properties:
        proxy:
          $ref: '#/components/schemas/MachineProxyView'
        id:
          type: string
        display_name:
          type: string
        kind:
          type: string
          enum:
          - managed
          - external
          description: managed is a Coasty-hosted VM; external is a customer-operated driver that supplies frames and executes typed commands.
        capabilities:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MachineCapability'
        protocol_version:
          type:
          - string
          - 'null'
          description: External-driver protocol version. null for managed machines.
        connection_status:
          type:
          - string
          - 'null'
          enum:
          - connected
          - disconnected
          - stale
          - revoked
          description: Liveness of an external driver. null for managed machines; separate from the hosted-VM lifecycle status.
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Most recent authenticated observation, command poll, result, or heartbeat from an external driver.
        status:
          type: string
          enum:
          - creating
          - provisioning
          - starting
          - running
          - stopping
          - stopped
          - restarting
          - suspended
          - deleting
          - terminated
          - error
        os_type:
          type: string
          enum:
          - linux
          - windows
          default: linux
          description: Runtime compatibility family. External-driver platform is supplied at enrollment and may be macOS or other even when this compatibility field is linux.
