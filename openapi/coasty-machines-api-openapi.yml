openapi: 3.2.0
info:
  title: Coasty Public Machines API
  version: 1.0.0
  summary: Computer Use Agents, scheduled automation, and managed VMs.
  description: '# Coasty Public API


    Coasty is a Computer Use Agent (CUA) platform: predict actions from screenshots,

    provision managed VMs, and run scheduled automation against them. ## Authentication


    All endpoints (except `/v1/triggers/webhook/{webhook_id}` and health checks) require an API key. Pass it as either:


    - `X-API-Key: sk-coasty-live-...` (or `sk-coasty-test-...` for sandbox)

    - `Authorization: Bearer sk-coasty-live-...`


    The external webhook endpoint does not use an API key, but it is authenticated:

    send the HMAC-SHA256 `Coasty-Signature` credential documented on that operation. Test-mode keys (`sk-coasty-test-*`) preserve the same core schemas for documented

    sandbox-supported operations and never debit Coasty credits. With a test Coasty key,

    explicit BYOK is provider-direct only for the direct CUA flow: `POST /v1/predict`,

    `POST /v1/ground`, `POST /v1/sessions`, and `POST /v1/sessions/{id}/predict`. Predict, ground, and session create require an explicit per-request X-LLM-Api-Key plus

    X-LLM-Provider under test auth. A body provider without that header returns 422

    LLM_KEY_NOT_CONFIGURED: Stored provider keys are unavailable for test API keys. Send

    X-LLM-Api-Key explicitly for direct BYOK. Test auth never reads or uses a stored live provider

    key. Session create fixes that explicit key for

    inherited predicts but makes no inference call. Predict, ground, and session predict can bill

    the supplied provider account. Managed-mode Task runs, Workflow runs, and schedules remain

    deterministic sandbox. BYOK intent on those async endpoints returns 422

    LLM_PROVIDER_UNSUPPORTED before execution: BYOK is unavailable for synthetic test runs,

    workflows, and schedules. Use managed mode or a live Coasty API key. They never decrypt or

    require a stored provider key and do not call or bill Anthropic/OpenAI. Live-only stored BYOK-key access or mutation is unavailable to test keys. Keep real provider

    secrets out of sandbox and CI requests, and use a live Coasty key for real async execution. ## Pricing & budgeting


    Published base rates and defaults (read effective deployed CUA/task pricing at

    `GET /v1/models` → `pricing`, and machine runtime pricing at `GET /v1/machines/pricing`):


    | Endpoint | Credits |

    |---|---|

    | `POST /v1/predict` | Managed: 5 base; BYOK: 0 |

    | `POST /v1/sessions` | Managed: 10 fixed; BYOK: 0 |

    | `POST /v1/sessions/{id}/predict` | Managed: 4 base; BYOK: 0 |

    | `POST /v1/ground` | Managed: 3 base; BYOK: 0 |

    | `POST /v1/parse` | 0 (free) |


    Predict and session-predict can add provider-visible trajectory-image, HD current/trajectory

    image, v1-engine, and combined system_prompt + trimmed-instructions (>500 chars) surcharges. Ground can add only the current-image HD surcharge; session creation has no surcharge. Managed-model published defaults: scheduled CUA execution bills the consumer subscription-credit balance

    at 10 credits/minute with a 20-credit start minimum for non-Unlimited accounts. Unlimited

    bypasses that runtime credit meter/start gate but retains token and concurrency safeguards. Managed schedule create/run-now use a $0.20 API-wallet eligibility gate. BYOK schedules

    bypass that gate and the runtime credit meter and debit zero Coasty platform credits. Live-key schedule execution is provider-billed. Managed-mode test execution is deterministic sandbox; test-auth BYOK intent returns 422 LLM_PROVIDER_UNSUPPORTED. Read `GET /v1/models` →

    `pricing.schedules` for effective values, plan applicability, and webhook policy. Your subscription tier (`free | starter | professional | enterprise`) is

    reported on the key, but the developer API is PREPAID: what bounds you is your

    credit balance, not your plan. Custom prompts in particular are NOT tier-gated. `system_prompt` and `instructions` are available on every tier including free,

    against a budget of 32,000 characters SHARED between the two fields (the sum is

    measured, and exceeding it returns 400 INPUT_TOO_LARGE).'
  contact:
    name: Coasty Developer Support
    url: https://coasty.ai/support
    email: founders@coasty.ai
  license:
    name: MIT
    identifier: MIT
  termsOfService: https://coasty.ai/terms
servers:
- url: https://coasty.ai
  description: Production
- url: https://coasty.ai
  description: Sandbox — use sk-coasty-test-* keys against the same host. No Coasty billing. Explicit-header BYOK can call the provider only for predict, ground, and inherited session predict; session create fixes the header key without inference, and test auth never reads a stored live key. Managed-mode Tasks, Workflows, and schedules remain deterministic sandbox. BYOK intent on those async endpoints returns 422 LLM_PROVIDER_UNSUPPORTED before execution and makes no provider call.
security:
- apiKey: []
- bearerAuth: []
tags:
- name: Machines
  description: Provision managed VMs or enroll customer-operated external machines. Runs and Workflow task steps use the same machine_id contract for both kinds.
paths:
  /v1/machines:
    post:
      tags:
      - Machines
      operationId: provisionMachine
      summary: Provision a new VM
      description: 'Managed VM provisioning. Managed machines debit the Developer API wallet by runtime state, not agent-minute execution: published defaults are 5 credits/hour running Linux, 9 running Windows, and 1 stopped/suspended, with per-minute granularity. Read effective deployed rates from GET /v1/machines/pricing. Test keys (sk-coasty-test-*) return mock VMs with no cloud calls.'
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionRequest'
      responses:
        '200':
          description: Machine provisioned (or in-progress).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProvisionResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
            X-Coasty-Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Idempotency-Status:
              $ref: '#/components/headers/IdempotencyStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/PaymentRequired'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: machines:write
      x-required-scopes:
      - machines:write
      x-scope-policy: required
      x-billing-code: machine_runtime
      x-offering: machines
      x-feature-flag: PUBLIC_MACHINES_API_ENABLED
      x-idempotency: reserve-and-replay
    get:
      tags:
      - Machines
      operationId: listMachines
      summary: List machines
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Machines list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMachinesResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: machines:read
      x-required-scopes:
      - machines:read
      x-scope-policy: required
      x-billing-code: null
      x-offering: machines
      x-feature-flag: PUBLIC_MACHINES_API_ENABLED
      x-idempotency: none
  /v1/machines/external:
    post:
      tags:
      - Machines
      operationId: enrollExternalMachine
      summary: Enroll a customer-operated machine
      description: 'Scope: `machines:write`. Creates an external machine_id for normal Tasks, Workflows, and schedules without provisioning Coasty compute. Authenticate this enrollment with the OWNER API key. Idempotency-Key is required: same key + canonical body safely replays the committed enrollment; a different body conflicts. The response contains a machine-scoped device_token only in this no-store enrollment response/replay, never in list/get; never put an owner API key in the driver.'
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/RequiredIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalMachineEnrollRequest'
      responses:
        '201':
          description: External machine enrolled. Persist device_token immediately. It is recoverable only by replaying the exact Idempotency-Key/body within the 24-hour enrollment recovery window; list/get never return it.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
            X-Coasty-Idempotent-Replay:
              $ref: '#/components/headers/IdempotentReplay'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
            Idempotency-Status:
              $ref: '#/components/headers/IdempotencyStatus'
            Cache-Control:
              description: Enrollment contains a one-time secret and must never be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMachineEnrollResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: machines:write
      x-required-scopes:
      - machines:write
      x-scope-policy: required
      x-billing-code: null
      x-offering: machines
      x-feature-flag: PUBLIC_MACHINES_API_ENABLED
      x-idempotency: account-enrollment-replay
  /v1/machines/health:
    get:
      tags:
      - Machines
      operationId: machinesHealth
      summary: Machines API health check
      security: []
      responses:
        '200':
          description: OK.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
      x-auth-mode: public
      x-required-scope: null
      x-required-scopes: []
      x-scope-policy: none
      x-billing-code: null
      x-offering: machines
      x-feature-flag: null
      x-idempotency: none
  /v1/machines/pricing:
    get:
      tags:
      - Machines
      operationId: getMachinePricing
      summary: Get the live machine runtime rate card
      description: 'Scope: `machines:read`. Returns deployment-effective runtime rates, one-time charges, provisioning eligibility gate (a minimum-balance gate, not a fee), billing granularity, insufficient-funds behavior, and TTL bounds.'
      security:
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: Current machine pricing and lease policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachinePricingResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: machines:read
      x-required-scopes:
      - machines:read
      x-scope-policy: required
      x-billing-code: null
      x-offering: machines
      x-feature-flag: PUBLIC_MACHINES_API_ENABLED
      x-idempotency: none
  /v1/billing/active:
    get:
      tags:
      - Machines
      operationId: getActiveBilling
      summary: What is billing me right now
      description: 'Lists every API-billed machine currently metering your wallet (running OR stopped — stopped bills at the storage-only rate). current_run_rate_cents_per_hour is the summed instantaneous burn rate. Test-mode keys return an empty fleet (active: [], rate 0). 1 credit = 1 cent.'
      security:
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: Currently-metering fleet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingActiveResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: machines:read
      x-required-scopes:
      - machines:read
      x-scope-policy: required
      x-billing-code: null
      x-offering: billing
      x-feature-flag: PUBLIC_BILLING_API_ENABLED
      x-idempotency: none
  /v1/machines/{machine_id}:
    parameters:
    - $ref: '#/components/parameters/MachineId'
    get:
      tags:
      - Machines
      operationId: getMachine
      summary: Get machine details
      security:
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: Machine.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMachineResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/GatewayTimeout'
      x-auth-mode: api_key
      x-required-scope: machines:read
      x-required-scopes:
      - machines:read
      x-scope-policy: required
      x-billing-code: null
      x-offering: machines
      x-feature-flag: PUBLIC_MACHINES_API_ENABLED
      x-idempotency: none
    delete:
      tags:
      - Machines
      operationId: terminateMachine
      summary: Terminate or revoke a machine
      description: Irreversible owner operation. Managed machines are terminated and stop runtime billing. External-machine registration is deleted, and its device token and every outstanding command lease are revoked immediately; caller-owned host and storage are untouched.
      security:
      - apiKey: []
      - bearerAuth: []
      responses:
        '200':
          description: Termination requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
