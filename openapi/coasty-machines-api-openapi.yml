components:
  schemas:
    DirectRequiredDirectoryParameters:
      type: object
      additionalProperties: false
      anyOf:
      - required:
        - path
      - required:
        - dirpath
      description: Send path or dirpath. If both aliases are present, their strings must be identical.
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        dirpath:
          type: string
          minLength: 1
          maxLength: 4096
    LifecycleResponse:
      type: object
      required:
      - machine_id
      - status
      - message
      - request_id
      properties:
        machine_id:
          type: string
        status:
          type: string
        message:
          type: string
        request_id:
          type: string
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - type
          - retryable
          - retry_with_same_idempotency_key
          - request_id
          properties:
            code:
              type: string
              description: Stable machine-readable error code (e.g. INVALID_API_KEY, INSUFFICIENT_CREDITS).
              examples:
              - INVALID_API_KEY
            message:
              type: string
              description: Human-readable explanation. May include suggestions or examples.
            type:
              type: string
              enum:
              - auth_error
              - validation_error
              - rate_limit_error
              - billing_error
              - not_found_error
              - state_error
              - server_error
              - client_error
            request_id:
              type: string
              description: Server-assigned correlation ID. Include in support requests.
              examples:
              - req_a1b2c3d4e5f6
            suggestion:
              type: string
              description: A concrete next step, auto-filled per code. LLM agents can act on it to self-recover.
            retryable:
              type: boolean
              description: 'true when retrying the same call may succeed (transient server failures + back-pressure: INTERNAL_ERROR, DB_UNAVAILABLE, SERVICE_UNAVAILABLE, UPSTREAM_*, PREDICTION_FAILED, *_FAILED, RATE_LIMITED, TOO_MANY_RUNS, IDEMPOTENCY_IN_FLIGHT, ...). false for deterministic client errors. A CUA BILLING_UNAVAILABLE caused by refund uncertainty is false unless the server confirmed a shared recovery checkpoint. Present on EVERY error envelope, including gateway/5xx/timeout paths.'
            retry_with_same_idempotency_key:
              type: boolean
              description: 'true only when the concrete response permits replay and the original request already carried the key. This covers the exact 18 generic reserve-and-replay operations plus the separate account-scoped external-enrollment replay domain. Reuse that SAME key with its identical bound inputs. A retryable error alone does not make an operation idempotent, and a key cannot be added retroactively. For CUA refund uncertainty this is true only after an exact shared checkpoint was confirmed; unkeyed or uncheckpointed responses are false and must not be retried automatically. A confirmed refunded failure sets this false even when retryable remains true: use a new key, because the old debit is compensated and wallet-guarded by IDEMPOTENCY_ALREADY_REFUNDED. false for deterministic errors.'
            retry_after:
              type:
              - integer
              - 'null'
              description: Seconds to wait before retrying (accompanies retryable:true back-pressure codes; mirrors the Retry-After header).
            rule:
              type: string
              enum:
              - max_actions
              - structured_action
              - allowed_actions
              - blocked_actions
              - blocked_keys
              - block_window_close
              - coordinate_bounds
              description: Present on ACTION_POLICY_VIOLATION errors and identifies the enforced policy rule.
            action_index:
              type: integer
              minimum: 0
              description: Zero-based proposed-action index on ACTION_POLICY_VIOLATION when the rule is attributable to one action; omitted for batch-level rules such as max_actions.
            action_type:
              type: string
              description: Proposed action type on ACTION_POLICY_VIOLATION when attributable to one action; omitted for batch-level or uninspectable values.
            examples:
              type: object
              additionalProperties: true
              description: 'Machine-readable limits for self-correction. On PAYLOAD_TOO_LARGE / INVALID_SCREENSHOT: { max_base64_bytes: 10485760 (legacy name), max_base64_chars: 10485760, max_request_body_bytes: 15728640, max_mb: 10, min_base64_chars: 100, formats: ["png","jpeg"] }.'
    DirectTabIndexParameters:
      type: object
      additionalProperties: false
      not:
        required:
        - tab_index
        - index
      properties:
        tab_index:
          type: integer
          minimum: 0
          maximum: 10000
        index:
          type: integer
          minimum: 0
          maximum: 10000
    DirectDirectoryParameters:
      type: object
      additionalProperties: false
      description: Defaults to '.'. If path and dirpath are both present, their strings must be identical.
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        dirpath:
          type: string
          minLength: 1
          maxLength: 4096
    BatchActionRequest:
      type: object
      required:
      - steps
      additionalProperties: false
      properties:
        steps:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/ActionRequest'
        stop_on_error:
          type: boolean
          default: true
        action_policy:
          $ref: '#/components/schemas/ActionPolicy'
          description: Checked atomically against the complete batch before step one. Individual steps may also carry their own action_policy.
    SnapshotResponse:
      type: object
      required:
      - machine_id
      - snapshot_id
      - name
      - created_at
      - credits_charged
      - request_id
      properties:
        machine_id:
          type: string
        snapshot_id:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        credits_charged:
          type: integer
        request_id:
          type: string
    DirectMoveParameters:
      type: object
      required:
      - x
      - y
      additionalProperties: false
      properties:
        x:
          type: integer
          minimum: 0
          maximum: 100000
        y:
          type: integer
          minimum: 0
          maximum: 100000
    DirectKeyPressParameters:
      type: object
      additionalProperties: false
      oneOf:
      - required:
        - key
      - required:
        - keys
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
        keys:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 64
    DirectClickParameters:
      type: object
      required:
      - x
      - y
      additionalProperties: false
      properties:
        x:
          type: integer
          minimum: 0
          maximum: 100000
        y:
          type: integer
          minimum: 0
          maximum: 100000
        button:
          type: string
          enum:
          - left
          - right
          - middle
          default: left
        clicks:
          type: integer
          minimum: 1
          maximum: 3
          default: 1
    DirectWindowTargetParameters:
      type: object
      additionalProperties: false
      not:
        required:
        - window_title
        - window_id
      properties:
        window_title:
          type: string
          minLength: 1
          maxLength: 512
        window_id:
          type: string
          minLength: 1
          maxLength: 128
    ScreenshotResponse:
      type: object
      required:
      - machine_id
      - image_b64
      - mime_type
      - width
      - height
      - captured_at
      - request_id
      properties:
        machine_id:
          type: string
        image_b64:
          type: string
          description: 'Base64-encoded screenshot (no data: prefix).'
        mime_type:
          type: string
          default: image/jpeg
        width:
          type: integer
        height:
          type: integer
        captured_at:
          type: string
          format: date-time
        frame_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Opaque external-machine observation identity. Bind the next external action to this value with precondition_frame_id; null for managed machines.
        request_id:
          type: string
    DirectScrollParameters:
      type: object
      additionalProperties: false
      oneOf:
      - required:
        - clicks
      - required:
        - amount
      dependentRequired:
        x:
        - y
        y:
        - x
      properties:
        clicks:
          type: integer
          minimum: -100
          maximum: 100
          not:
            const: 0
        amount:
          type: integer
          minimum: 1
          maximum: 100
        direction:
          type: string
          enum:
          - vertical
          - horizontal
          - up
          - down
          - left
          - right
          default: vertical
        x:
          type: integer
          minimum: 0
          maximum: 100000
        y:
          type: integer
          minimum: 0
          maximum: 100000
    ProvisionResponse:
      type: object
      required:
      - machine
      - connection
      - request_id
      properties:
        machine:
          $ref: '#/components/schemas/MachineRecord'
        connection:
          $ref: '#/components/schemas/ConnectionDetailsRedacted'
        request_id:
          type: string
    MachineCapability:
      type: string
      enum:
      - screenshot
      - mouse
      - keyboard
      - scroll
      - terminal
      - files
      - browser
      description: A capability the machine driver can execute. External-machine runs are dispatched only when the enrolled driver advertises every capability required by the task.
    ExternalMachineEnrollRequest:
      type: object
      required:
      - display_name
      - platform
      - capabilities
      additionalProperties: false
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 64
        protocol_version:
          type: string
          const: '1'
          default: '1'
          description: Driver protocol major version. Unsupported major versions fail before enrollment.
        capabilities:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          contains:
            const: screenshot
          minContains: 1
          maxContains: 1
          items:
            $ref: '#/components/schemas/MachineCapability'
        platform:
          type: string
          enum:
          - windows
          - macos
          - linux
          - other
        screen_width:
          type:
          - integer
          - 'null'
          minimum: 320
          maximum: 3840
        screen_height:
          type:
          - integer
          - 'null'
          minimum: 240
          maximum: 2160
          description: screen_width and screen_height must be supplied together when either is present.
        metadata:
          type: object
          maxProperties: 16
          propertyNames:
            maxLength: 64
          additionalProperties:
            type: string
            maxLength: 256
          description: Non-secret labels only. Never put device credentials or screenshot data in metadata.
    ExternalMachineObservationRequest:
      type: object
      required:
      - sequence
      - screenshot
      - media_type
      additionalProperties: false
      allOf:
      - if:
          required:
          - width
        then:
          required:
          - height
      - if:
          required:
          - height
        then:
          required:
          - width
      - if:
          required:
          - media_type
          properties:
            media_type:
              const: image/png
        then:
          properties:
            screenshot:
              pattern: ^(?:[A-Za-z0-9+/=]+|data:image/png;base64,[A-Za-z0-9+/=]+)$
      - if:
          required:
          - media_type
          properties:
            media_type:
              const: image/jpeg
        then:
          properties:
            screenshot:
              pattern: ^(?:[A-Za-z0-9+/=]+|data:image/jpeg;base64,[A-Za-z0-9+/=]+)$
      properties:
        sequence:
          type: integer
          minimum: 1
        media_type:
          type: string
          enum:
          - image/png
          - image/jpeg
        screenshot:
          $ref: '#/components/schemas/ScreenshotBase64'
          description: Base64 PNG/JPEG bytes, either raw or in a data URI that exactly matches media_type. The 100 through 10,485,760 character bounds apply to the base64 payload after the optional prefix. The server decodes the image, verifies media type/dimensions/digest, strips metadata, and never trusts declarations alone.
        sha256:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
          description: Optional SHA-256 of the submitted decoded image bytes, before metadata stripping and server normalization.
        width:
          type:
          - integer
          - 'null'
          minimum: 320
          maximum: 3840
        height:
          type:
          - integer
          - 'null'
          minimum: 240
          maximum: 2160
          description: width and height must be supplied together when either is present.
    UpdateMachineRequest:
      type: object
      required:
      - ttl_minutes
      additionalProperties: false
      properties:
        ttl_minutes:
          type: integer
          minimum: 0
          maximum: 10080
          description: 0 clears resource expiry; otherwise the value must be between 5 and 10080. Managed expiry destroys infrastructure; external expiry only revokes and deletes the Coasty registration, leaving caller-owned host/storage untouched.
          oneOf:
          - const: 0
          - minimum: 5
            maximum: 10080
    DirectListDownloadsParameters:
      type: object
      additionalProperties: false
      description: Directory defaults to '.'. If path and dirpath are both present, their strings must be identical.
      properties:
        path:
          type: string
          minLength: 1
          maxLength: 4096
        dirpath:
          type: string
          minLength: 1
          maxLength: 4096
        recursive:
          type: boolean
          default: false
        max_files:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
    BillingActiveResponse:
      type: object
      required:
      - active
      - current_run_rate_cents_per_hour
      - request_id
      properties:
        active:
          type: array
          items:
            $ref: '#/components/schemas/BillingActiveItem'
          description: Every API-billed machine currently metering (running OR stopped). Empty for test-mode keys.
        current_run_rate_cents_per_hour:
          type: integer
          description: Summed instantaneous burn rate across the active list — total cents/hour right now.
        request_id:
          type: string
    DirectBrowserExecuteParameters:
      type: object
      additionalProperties: false
      oneOf:
      - required:
        - script
      - required:
        - code
      properties:
        script:
          type: string
          minLength: 1
          maxLength: 100000
        code:
          type: string
          minLength: 1
          maxLength: 100000
    ExternalMachineObservationResponse:
      type: object
      required:
      - machine_id
      - frame_id
