    ActionPolicy:
      type: object
      additionalProperties: false
      description: Opt-in, fail-closed post-model action enforcement. The complete normalized batch is checked atomically before actions are returned or dispatched. allowed_actions and blocked_actions cannot overlap. Prediction, Session, and Parse surfaces use prediction action names such as type_text; direct Machine routes use command names such as type. Task, Workflow, and Schedule policies are create-time controls inherited across execution and recovery.
      properties:
        allowed_actions:
          type:
          - array
          - 'null'
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^\s*[A-Za-z][A-Za-z0-9_:-]{0,63}\s*$
          description: Optional action allowlist. Values are trimmed and lowercased before validation; duplicates after normalization are rejected. Terminal done/fail/awaiting_human signals remain allowed.
        blocked_actions:
          type: array
          maxItems: 128
          uniqueItems: true
          default: []
          items:
            type: string
            pattern: ^\s*[A-Za-z][A-Za-z0-9_:-]{0,63}\s*$
          description: Action denylist. Values are trimmed and lowercased before validation; duplicates after normalization are rejected.
        blocked_keys:
          type: array
          maxItems: 128
          uniqueItems: true
          default: []
          items:
            type: string
            pattern: ^\s*[A-Za-z0-9_+\-=\[\]\\;',./`]{1,64}\s*$
          description: Keys forbidden in key_press, key_combo, and modifier-bearing actions. Values are trimmed and lowercased; duplicates after normalization are rejected; esc aliases escape.
        block_window_close:
          type: boolean
          default: false
          description: Block explicit close commands and common Alt+F4, Ctrl/Cmd+W, and Cmd+Q shortcuts.
        max_actions:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
          description: Maximum number of actions admitted in one prediction/session step, parsed action batch, or direct Machine batch.
        coordinate_bounds:
          anyOf:
          - $ref: '#/components/schemas/CoordinateBounds'
          - type: 'null'
