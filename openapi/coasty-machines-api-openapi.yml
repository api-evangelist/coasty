      x-required-scopes:
      - machines:write
      x-scope-policy: required
      x-billing-code: null
      x-offering: machines
      x-feature-flag: PUBLIC_MACHINES_API_ENABLED
      x-idempotency: none
    patch:
      tags:
      - Machines
      operationId: updateMachine
      summary: Set, extend, or clear a machine resource-expiry lease
      description: 'Scope: `machines:write`. `ttl_minutes=0` clears expiry; values 5..10080 schedule expiry from now. Expiry destroys managed infrastructure. For an external machine it deletes only the Coasty registration and revokes device access/leases; caller-owned host and storage remain untouched.'
      security:
      - apiKey: []
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMachineRequest'
      responses:
