      x-offering: machines
      x-feature-flag: PUBLIC_MACHINES_API_ENABLED
      x-idempotency: none
  /v1/machines/{machine_id}/commands:
    parameters:
    - $ref: '#/components/parameters/MachineId'
    get:
      tags:
      - Machines
      operationId: listExternalMachineCommands
      summary: Long-poll commands for an external machine
      description: DEVICE TOKEN ONLY. Returns commands after an exclusive cursor. Persist next_cursor only after durably processing the batch. A long-poll timeout returns 200 with data=[]; reconnect with the last committed cursor. The server permits exactly one queued or delivered command per external machine; concurrent dispatch returns 409 MACHINE_BUSY, preventing cross-replica races on one physical display. Each command is fenced, deadline-bound, and tied to the frame in precondition_frame_id. A driver must reject expired, stale-fenced, unsupported, or visibly stale commands instead of executing them.
      security:
      - machineToken: []
      parameters:
      - $ref: '#/components/parameters/ExternalCommandAfter'
      - $ref: '#/components/parameters/ExternalCommandLimit'
      - $ref: '#/components/parameters/ExternalCommandWaitSeconds'
      responses:
        '200':
          description: Command batch, or an empty data array when the long poll expires.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalMachineCommandsResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/DeviceUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
