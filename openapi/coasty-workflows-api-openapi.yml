  /v1/workflows/runs:
    post:
      tags:
      - Workflows
      operationId: startAdhocWorkflowRun
      summary: Start an ad-hoc workflow run
      description: 'Scope: `workflows:write`. Runs an inline `definition` without saving it. Managed defaults charge 5 credits per completed `task` step on v3/v4/v5 and 8 on v1; other step types are free and budget_cents caps managed spend. With a live Coasty key, BYOK runs every task role on YOUR provider key with zero Coasty platform credits and no managed-step budget reservation, while persisting actual provider tokens. Under test auth, managed-mode Workflow task children remain deterministic sandbox execution. Any BYOK header or provider metadata instead returns 422 LLM_PROVIDER_UNSUPPORTED before execution: BYOK is unavailable for synthetic test runs, workflows, and schedules. Use managed mode or a live Coasty API key. Test execution never decrypts or requires a stored provider key and does not call or bill Anthropic/OpenAI. Task steps do not inherit /v1/predict trajectory, HD-image, or combined-prompt surcharges. The live BYOK key snapshot is encrypted for recovery and scrubbed at terminal state.'
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/XLLMProvider'
      - $ref: '#/components/parameters/XLLMApiKey'
      - $ref: '#/components/parameters/XLLMModel'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartAdhocWorkflowRunRequest'
      responses:
