  /v1/workflows/runs/{run_id}/events:
    parameters:
    - $ref: '#/components/parameters/RunId'
    get:
      tags:
      - Workflows
      operationId: streamWorkflowRunEvents
      summary: Stream workflow run events (SSE)
      description: 'Scope: `workflows:read`. Free. Ordered at-least-once SSE for successfully persisted frames; resume with `Last-Event-ID` or `?after=`. Workflow event appends, including terminal frames, are best-effort and can be absent if storage or the worker fails after the durable state transition. The edge may rotate a connection after 300 seconds; reconcile authoritative state with GET /v1/workflows/runs/{run_id} rather than waiting indefinitely for a terminal frame.


        As with run streams, the connection can close on `event: done`, on `event: timeout` with `data: {"reason":"stream_max_duration"}` when the server''s stream wall-clock ceiling is reached (the workflow run may still be going), or on `event: error` with `data: {"code":..., "message":...}`. Only `done` describes the run; the other two describe the stream.'
      security:
      - apiKey: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/LastEventId'
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: SSE stream (text/event-stream).
          content:
            text/event-stream:
              schema:
                type: string
              description: A Server-Sent Events byte stream. Each frame carries an event name/id and JSON in its data field; reconnect with Last-Event-ID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
            X-Coasty-Request-Id:
              $ref: '#/components/headers/CoastyRequestId'
            X-Coasty-Key-Kind:
              $ref: '#/components/headers/KeyKind'
            X-Coasty-Test-Mode:
              $ref: '#/components/headers/TestMode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
