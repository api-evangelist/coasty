      properties:
        op:
          type: string
          enum:
          - and
          - or
        conditions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/WorkflowCondition'
    WorkflowStep:
      oneOf:
      - $ref: '#/components/schemas/WorkflowTaskStep'
      - $ref: '#/components/schemas/WorkflowAssertStep'
      - $ref: '#/components/schemas/WorkflowIfStep'
      - $ref: '#/components/schemas/WorkflowLoopStep'
      - $ref: '#/components/schemas/WorkflowParallelStep'
      - $ref: '#/components/schemas/WorkflowHumanApprovalStep'
      - $ref: '#/components/schemas/WorkflowRetryStep'
      - $ref: '#/components/schemas/WorkflowSucceedStep'
      - $ref: '#/components/schemas/WorkflowFailStep'
      discriminator:
        propertyName: type
        mapping:
          task: '#/components/schemas/WorkflowTaskStep'
          assert: '#/components/schemas/WorkflowAssertStep'
          if: '#/components/schemas/WorkflowIfStep'
          loop: '#/components/schemas/WorkflowLoopStep'
          parallel: '#/components/schemas/WorkflowParallelStep'
          human_approval: '#/components/schemas/WorkflowHumanApprovalStep'
          retry: '#/components/schemas/WorkflowRetryStep'
          succeed: '#/components/schemas/WorkflowSucceedStep'
          fail: '#/components/schemas/WorkflowFailStep'
    WorkflowParallelBranchStep:
      description: Parallel-safe step. human_approval, succeed, and fail are forbidden at every depth inside a parallel branch because they mutate the whole workflow state.
      oneOf:
      - $ref: '#/components/schemas/WorkflowTaskStep'
      - $ref: '#/components/schemas/WorkflowAssertStep'
      - $ref: '#/components/schemas/WorkflowParallelBranchIfStep'
      - $ref: '#/components/schemas/WorkflowParallelBranchLoopStep'
      - $ref: '#/components/schemas/WorkflowParallelStep'
      - $ref: '#/components/schemas/WorkflowParallelBranchRetryStep'
      discriminator:
        propertyName: type
        mapping:
          task: '#/components/schemas/WorkflowTaskStep'
          assert: '#/components/schemas/WorkflowAssertStep'
          if: '#/components/schemas/WorkflowParallelBranchIfStep'
          loop: '#/components/schemas/WorkflowParallelBranchLoopStep'
          parallel: '#/components/schemas/WorkflowParallelStep'
          retry: '#/components/schemas/WorkflowParallelBranchRetryStep'
    WorkflowParallelBranchLoopStep:
      type: object
      required:
      - id
      - type
      - body
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        type:
          type: string
          const: loop
        count:
          type:
          - integer
          - 'null'
          minimum: 0
        while:
          oneOf:
          - $ref: '#/components/schemas/WorkflowCondition'
          - type: 'null'
        body:
          $ref: '#/components/schemas/WorkflowParallelBranchStepList'
        max_iterations:
          type:
          - integer
          - 'null'
          minimum: 1
      oneOf:
      - required:
        - count
        properties:
          count:
            type: integer
          while:
            type: 'null'
      - required:
        - while
        properties:
          count:
            type: 'null'
          while:
            $ref: '#/components/schemas/WorkflowCondition'
    WorkflowSucceedStep:
      type: object
      required:
      - id
      - type
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        type:
          type: string
          const: succeed
        output:
          type:
          - object
          - 'null'
          additionalProperties: true
    WorkflowDeleteResponse:
      type: object
      required:
      - id
      - object
      - deleted
      properties:
        id:
          type: string
        object:
          type: string
          enum:
          - workflow
        deleted:
          type: boolean
          enum:
          - true
        request_id:
          type: string
    WorkflowCondition:
      description: Injection-safe structured condition. Free-text expressions and executable code are not accepted. The server also enforces the configured recursive condition-depth ceiling.
      oneOf:
      - $ref: '#/components/schemas/WorkflowBinaryCondition'
      - $ref: '#/components/schemas/WorkflowUnaryCondition'
      - $ref: '#/components/schemas/WorkflowLogicalCondition'
      - $ref: '#/components/schemas/WorkflowNotCondition'
      discriminator:
        propertyName: op
        mapping:
          eq: '#/components/schemas/WorkflowBinaryCondition'
          ne: '#/components/schemas/WorkflowBinaryCondition'
          lt: '#/components/schemas/WorkflowBinaryCondition'
          gt: '#/components/schemas/WorkflowBinaryCondition'
          lte: '#/components/schemas/WorkflowBinaryCondition'
          gte: '#/components/schemas/WorkflowBinaryCondition'
          contains: '#/components/schemas/WorkflowBinaryCondition'
          truthy: '#/components/schemas/WorkflowUnaryCondition'
          falsy: '#/components/schemas/WorkflowUnaryCondition'
          exists: '#/components/schemas/WorkflowUnaryCondition'
          and: '#/components/schemas/WorkflowLogicalCondition'
          or: '#/components/schemas/WorkflowLogicalCondition'
          not: '#/components/schemas/WorkflowNotCondition'
    WorkflowStepList:
      type: array
      minItems: 1
      maxItems: 200
      items:
        $ref: '#/components/schemas/WorkflowStep'
    WorkflowDefinition:
      type: object
      required:
      - steps
      additionalProperties: false
      description: Workflow DSL version 2026-06-01. The schema encodes each strict step shape and recursive body. The server additionally enforces globally unique step ids, a configurable aggregate step count, definition byte size, and recursive workflow/output depth.
      properties:
        steps:
          $ref: '#/components/schemas/WorkflowStepList'
        output:
          type:
          - object
          - 'null'
          additionalProperties: true
    WorkflowFailStep:
      type: object
      required:
      - id
      - type
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        type:
          type: string
          const: fail
        message:
          type:
          - string
          - 'null'
          maxLength: 4000
    WorkflowLoopStep:
      type: object
      required:
      - id
      - type
      - body
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        type:
          type: string
          const: loop
        count:
          type:
          - integer
          - 'null'
          minimum: 0
        while:
          oneOf:
          - $ref: '#/components/schemas/WorkflowCondition'
          - type: 'null'
        body:
          $ref: '#/components/schemas/WorkflowStepList'
        max_iterations:
          type:
          - integer
          - 'null'
          minimum: 1
      oneOf:
      - required:
        - count
        properties:
          count:
            type: integer
          while:
            type: 'null'
      - required:
        - while
        properties:
          count:
            type: 'null'
          while:
            $ref: '#/components/schemas/WorkflowCondition'
    StartAdhocWorkflowRunRequest:
      allOf:
      - $ref: '#/components/schemas/StartWorkflowRunRequest'
      - required:
        - definition
        properties:
          definition:
            $ref: '#/components/schemas/WorkflowDefinition'
    WorkflowResponse:
      type: object
      required:
      - id
      - object
      - name
      - slug
      - version
      properties:
        id:
          type: string
        object:
          type: string
          enum:
          - workflow
        name:
          type: string
        slug:
          type: string
        version:
          type: integer
        dsl_version:
          type: string
          default: '2026-06-01'
        definition:
          $ref: '#/components/schemas/WorkflowDefinition'
        inputs_schema:
          $ref: '#/components/schemas/WorkflowInputsSchema'
        description:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - active
          - archived
          default: active
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        created_at:
          type:
          - string
          - 'null'
        updated_at:
          type:
          - string
          - 'null'
        request_id:
          type:
          - string
          - 'null'
    ListWorkflowsResponse:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          enum:
          - list
        data:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowResponse'
        has_more:
          type: boolean
          default: false
        request_id:
          type: string
    WorkflowBinaryCondition:
      type: object
      required:
      - op
      - left
      - right
      additionalProperties: false
      properties:
        op:
          type: string
          enum:
          - eq
          - ne
          - lt
          - gt
          - lte
          - gte
          - contains
        left:
          description: A finite JSON literal or a {{dotted.path}} variable reference.
        right:
          description: A finite JSON literal or a {{dotted.path}} variable reference.
    WorkflowTaskStep:
      type: object
      required:
      - id
      - type
      - task
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        type:
          type: string
          const: task
        task:
          type: string
          minLength: 1
          maxLength: 20000
          pattern: \S
          description: Non-blank task text. Supports {{dotted.path}} substitutions.
        machine_id:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 128
          pattern: \S
          description: Optional per-step managed or connected external machine override.
        cua_version:
          type:
          - string
          - 'null'
          enum:
          - v1
          - v3
          - v4
          - v5
          - null
          description: Omit or use null for the latest version (v5).
        instructions:
          type:
          - string
          - 'null'
          maxLength: 20000
        system_prompt:
          type:
          - string
          - 'null'
          maxLength: 20000
        max_steps:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000
        save_as:
          type:
          - string
          - 'null'
          pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
          not:
            enum:
            - inputs
            - vars
          description: Result binding name; inputs and vars are reserved namespaces.
        on_awaiting_human:
          type:
          - string
          - 'null'
          enum:
          - pause
          - fail
          - cancel
          - null
        continue_on_failure:
          type:
          - boolean
          - 'null'
    ActionPolicy:
      type: object
      additionalProperties: false
      description: Opt-in, fail-closed post-model action enforcement. The complete normalized batch is checked atomically before actions are returned or dispatched. allowed_actions and blocked_actions cannot overlap. Prediction, Session, and Parse surfaces use prediction action names such as type_text; direct Machine routes use command names such as type. Task, Workflow, and Schedule policies are create-time controls inherited across execution and recovery.
      properties:
        allowed_actions:
          type:
          - array
          - 'null'
          minItems: 1
          maxItems: 128
          uniqueItems: true
          items:
            type: string
            pattern: ^\s*[A-Za-z][A-Za-z0-9_:-]{0,63}\s*$
          description: Optional action allowlist. Values are trimmed and lowercased before validation; duplicates after normalization are rejected. Terminal done/fail/awaiting_human signals remain allowed.
        blocked_actions:
          type: array
          maxItems: 128
          uniqueItems: true
          default: []
          items:
            type: string
            pattern: ^\s*[A-Za-z][A-Za-z0-9_:-]{0,63}\s*$
          description: Action denylist. Values are trimmed and lowercased before validation; duplicates after normalization are rejected.
        blocked_keys:
          type: array
          maxItems: 128
          uniqueItems: true
          default: []
          items:
            type: string
            pattern: ^\s*[A-Za-z0-9_+\-=\[\]\\;',./`]{1,64}\s*$
          description: Keys forbidden in key_press, key_combo, and modifier-bearing actions. Values are trimmed and lowercased; duplicates after normalization are rejected; esc aliases escape.
        block_window_close:
          type: boolean
          default: false
          description: Block explicit close commands and common Alt+F4, Ctrl/Cmd+W, and Cmd+Q shortcuts.
        max_actions:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 10000
          description: Maximum number of actions admitted in one prediction/session step, parsed action batch, or direct Machine batch.
        coordinate_bounds:
          anyOf:
          - $ref: '#/components/schemas/CoordinateBounds'
          - type: 'null'
    WorkflowParallelBranchRetryStep:
      type: object
      required:
      - id
      - type
      - body
      - max_attempts
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        type:
          type: string
          const: retry
        body:
          $ref: '#/components/schemas/WorkflowParallelBranchStepList'
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
    WorkflowRunResponse:
      type: object
      required:
      - id
      - object
      - status
      properties:
        id:
          type: string
        object:
          type: string
          enum:
          - workflow.run
        status:
          type: string
          enum:
          - queued
          - running
          - awaiting_human
          - succeeded
          - failed
          - cancelled
          - timed_out
        workflow_id:
          type:
          - string
          - 'null'
        workflow_version:
          type:
          - integer
          - 'null'
        machine_id:
          type:
          - string
          - 'null'
        inputs:
          type: object
          additionalProperties: true
        output:
          type:
          - object
          - 'null'
          additionalProperties: true
        error:
          type:
          - object
          - 'null'
          additionalProperties: true
        awaiting_human_reason:
          type:
          - string
          - 'null'
        awaiting_step_id:
          type:
          - string
          - 'null'
        iterations_used:
          type: integer
        spent_cents:
          type: integer
        budget_cents:
          type:
          - integer
          - 'null'
        llm:
          description: Non-secret BYOK echo for the workflow-run snapshot. It contains only provider, model, a 12-lowercase-hex key fingerprint, key source, and terminal scrub state. It never contains the key or ciphertext.
          oneOf:
          - $ref: '#/components/schemas/RunLlmInfo'
          - type: 'null'
        webhook_url:
          type:
          - string
          - 'null'
          description: Workflow lifecycle callback destination. Workflow callbacks are best-effort in-process notifications (up to 3 attempts), have no durable delivery UUID/outbox, and can be missed if the worker fails. Reconcile with GET /v1/workflows/runs/{run_id}.
        webhook_secret:
          type:
          - string
          - 'null'
          description: Returned by create and its exact bounded Idempotency-Key replay; null on get/list. The pinned per-run secret is encrypted at rest through delivery/replay recovery and later scrubbed.
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        created_at:
          type:
          - string
          - 'null'
        started_at:
          type:
          - string
          - 'null'
        finished_at:
          type:
          - string
          - 'null'
        request_id:
          type:
          - string
          - 'null'
