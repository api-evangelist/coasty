components:
  schemas:
    WorkflowInputDeclaration:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
          - any
          - string
          - integer
          - number
          - boolean
          - object
          - array
          - 'null'
          default: any
        required:
          type: boolean
          default: false
        default:
          description: Finite JSON default; when type is present this must match it.
        description:
          type: string
          maxLength: 2000
      allOf:
      - if:
          required:
          - type
          properties:
            type:
              const: string
        then:
          properties:
            default:
              type: string
      - if:
          required:
          - type
          properties:
            type:
              const: integer
        then:
          properties:
            default:
              type: integer
      - if:
          required:
          - type
          properties:
            type:
              const: number
        then:
          properties:
            default:
              type: number
      - if:
          required:
          - type
          properties:
            type:
              const: boolean
        then:
          properties:
            default:
              type: boolean
      - if:
          required:
          - type
          properties:
            type:
              const: object
        then:
          properties:
            default:
              type: object
      - if:
          required:
          - type
          properties:
            type:
              const: array
        then:
          properties:
            default:
              type: array
      - if:
          required:
          - type
          properties:
            type:
              const: 'null'
        then:
          properties:
            default:
              type: 'null'
    LlmConfig:
      type: object
      additionalProperties: false
      description: 'Opt-in BYOK model selection. provider ''managed'' (or omitting llm) keeps the platform default. There is deliberately no api_key field (422 if attempted): keys ride the X-LLM-Api-Key header or the encrypted /v1/llm/keys store only. Once BYOK is requested there is NO silent fallback to Coasty''s platform LLM keys.'
      properties:
        provider:
          type: string
          enum:
          - managed
          - anthropic
          - openai
          default: managed
          description: Whose LLM account runs the harness. Anything else is 422 LLM_PROVIDER_UNSUPPORTED.
        model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: 'Main worker model. Defaults: claude-sonnet-5 (anthropic), gpt-5.6-sol (openai). Model ids are 1-256 characters, begin with a letter or number, and then use only letters, numbers, dot, underscore, colon, slash, plus, at-sign, or hyphen; invalid ids return 422 LLM_MODEL_INVALID. The selected provider can still reject an unknown or inaccessible model. It must be vision-capable.'
        grounding_model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: Override for pixel-coordinate grounding. Defaults to model. Grounding quality is tuned on the platform model; expect best results with the defaults.
        compaction_model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: Override for trajectory compaction. Defaults to model. A cheaper model here is the classic cost tune.
        code_agent_model:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
          description: Override for the code agent. Defaults to model.
    WorkflowUnaryCondition:
      type: object
      required:
      - op
      - value
      additionalProperties: false
      properties:
        op:
          type: string
          enum:
          - truthy
          - falsy
          - exists
        value:
          description: A finite JSON literal or a {{dotted.path}} variable reference.
    CoordinateBounds:
      type: object
      required:
      - max_x
      - max_y
      additionalProperties: false
      description: Inclusive coordinate rectangle in the request screenshot's pixel space.
      properties:
        min_x:
          type: integer
          minimum: 0
          maximum: 3840
          default: 0
        min_y:
          type: integer
          minimum: 0
          maximum: 2160
          default: 0
        max_x:
          type: integer
          minimum: 0
          maximum: 3840
        max_y:
          type: integer
          minimum: 0
          maximum: 2160
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          - type
          - retryable
          - retry_with_same_idempotency_key
          - request_id
          properties:
            code:
              type: string
              description: Stable machine-readable error code (e.g. INVALID_API_KEY, INSUFFICIENT_CREDITS).
              examples:
              - INVALID_API_KEY
            message:
              type: string
              description: Human-readable explanation. May include suggestions or examples.
            type:
              type: string
              enum:
              - auth_error
              - validation_error
              - rate_limit_error
              - billing_error
              - not_found_error
              - state_error
              - server_error
              - client_error
            request_id:
              type: string
              description: Server-assigned correlation ID. Include in support requests.
              examples:
              - req_a1b2c3d4e5f6
            suggestion:
              type: string
              description: A concrete next step, auto-filled per code. LLM agents can act on it to self-recover.
            retryable:
              type: boolean
              description: 'true when retrying the same call may succeed (transient server failures + back-pressure: INTERNAL_ERROR, DB_UNAVAILABLE, SERVICE_UNAVAILABLE, UPSTREAM_*, PREDICTION_FAILED, *_FAILED, RATE_LIMITED, TOO_MANY_RUNS, IDEMPOTENCY_IN_FLIGHT, ...). false for deterministic client errors. A CUA BILLING_UNAVAILABLE caused by refund uncertainty is false unless the server confirmed a shared recovery checkpoint. Present on EVERY error envelope, including gateway/5xx/timeout paths.'
            retry_with_same_idempotency_key:
              type: boolean
              description: 'true only when the concrete response permits replay and the original request already carried the key. This covers the exact 18 generic reserve-and-replay operations plus the separate account-scoped external-enrollment replay domain. Reuse that SAME key with its identical bound inputs. A retryable error alone does not make an operation idempotent, and a key cannot be added retroactively. For CUA refund uncertainty this is true only after an exact shared checkpoint was confirmed; unkeyed or uncheckpointed responses are false and must not be retried automatically. A confirmed refunded failure sets this false even when retryable remains true: use a new key, because the old debit is compensated and wallet-guarded by IDEMPOTENCY_ALREADY_REFUNDED. false for deterministic errors.'
            retry_after:
              type:
              - integer
              - 'null'
              description: Seconds to wait before retrying (accompanies retryable:true back-pressure codes; mirrors the Retry-After header).
            rule:
              type: string
              enum:
              - max_actions
              - structured_action
              - allowed_actions
              - blocked_actions
              - blocked_keys
              - block_window_close
              - coordinate_bounds
              description: Present on ACTION_POLICY_VIOLATION errors and identifies the enforced policy rule.
            action_index:
              type: integer
              minimum: 0
              description: Zero-based proposed-action index on ACTION_POLICY_VIOLATION when the rule is attributable to one action; omitted for batch-level rules such as max_actions.
            action_type:
              type: string
              description: Proposed action type on ACTION_POLICY_VIOLATION when attributable to one action; omitted for batch-level or uninspectable values.
            examples:
              type: object
              additionalProperties: true
              description: 'Machine-readable limits for self-correction. On PAYLOAD_TOO_LARGE / INVALID_SCREENSHOT: { max_base64_bytes: 10485760 (legacy name), max_base64_chars: 10485760, max_request_body_bytes: 15728640, max_mb: 10, min_base64_chars: 100, formats: ["png","jpeg"] }.'
    WorkflowNotCondition:
      type: object
      required:
      - op
      - condition
      additionalProperties: false
      properties:
        op:
          type: string
          const: not
        condition:
          $ref: '#/components/schemas/WorkflowCondition'
    WorkflowParallelBranchStepList:
      type: array
      minItems: 1
      maxItems: 200
      items:
        $ref: '#/components/schemas/WorkflowParallelBranchStep'
    RunLlmInfo:
      type: object
      additionalProperties: false
      required:
      - provider
      - model
      - key_fingerprint
      - key_source
      - key_scrubbed
      properties:
        provider:
          type: string
          enum:
          - anthropic
          - openai
        model:
          type: string
          minLength: 1
          maxLength: 256
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:/+@-]{0,255}$
        key_fingerprint:
          type: string
          minLength: 12
          maxLength: 12
          pattern: ^[0-9a-f]{12}$
        key_source:
          type: string
          enum:
          - header
          - stored
        key_scrubbed:
          type: boolean
      description: Credential-free BYOK attribution returned by agent runs and workflow runs. Only these allowlisted fields are public.
    WorkflowInputsSchema:
      type: object
      propertyNames:
        pattern: ^[A-Za-z_][A-Za-z0-9_]{0,63}$
      additionalProperties:
        $ref: '#/components/schemas/WorkflowInputDeclaration'
      description: Typed input declarations. The server also enforces the configured serialized byte ceiling.
    ResumeWorkflowRunRequest:
      type: object
      additionalProperties: false
      properties:
        approved:
          type: boolean
          default: true
          description: Approve (continue) or reject (fail) the pending human_approval step.
        note:
          type:
          - string
          - 'null'
          maxLength: 2000
    WorkflowRetryStep:
      type: object
      required:
      - id
      - type
      - body
      - max_attempts
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        type:
          type: string
          const: retry
        body:
          $ref: '#/components/schemas/WorkflowStepList'
        max_attempts:
          type: integer
          minimum: 1
          maximum: 20
    StartWorkflowRunRequest:
      type: object
      additionalProperties: false
      properties:
        inputs:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Bound input values.
        machine_id:
          type:
          - string
          - 'null'
          maxLength: 128
          description: Default managed or connected external machine for task steps.
        budget_cents:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 10000000
          description: Hard spend cap across all task steps; 0 or null = unlimited.
        max_iterations:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 100000
        deadline_seconds:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 86400
        webhook_url:
          type:
          - string
          - 'null'
          maxLength: 2048
        metadata:
          type:
          - object
          - 'null'
          additionalProperties: true
        definition:
          description: Inline DSL for an ad-hoc run (POST /v1/workflows/runs). Omit when running a saved workflow.
          oneOf:
          - $ref: '#/components/schemas/WorkflowDefinition'
          - type: 'null'
        inputs_schema:
          description: Ad-hoc runs only.
          oneOf:
          - $ref: '#/components/schemas/WorkflowInputsSchema'
          - type: 'null'
        llm:
          $ref: '#/components/schemas/LlmConfig'
        action_policy:
          $ref: '#/components/schemas/ActionPolicy'
          description: Create-time policy inherited by every workflow task step, retry, recovery, and nested CUA delegation.
    WorkflowAssertStep:
      type: object
